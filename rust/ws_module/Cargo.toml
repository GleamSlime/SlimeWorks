[package]
name = "ws_module"
version = "0.1.0"
edition = "2021"

[dependencies]
flutter_rust_bridge = "=2.11.1"
tokio = { version = "1.49.0", features = [
  "rt-multi-thread",
  "sync",
  "net",
  "io-util",
  "time",
  "macros",
] }
tokio-tungstenite = "0.26"
tungstenite = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
lazy_static = "1.5"
slime_logger = { path = "../slime_logger" }
chrono = "0.4"
base64 = "0.22"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lib]
crate-type = ["staticlib", "rlib"]
