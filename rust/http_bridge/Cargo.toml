[package]
name = "http_bridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "http_bridge"
path = "src/lib.rs"
# 动态库，用于动态加载
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.49.0", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "sync",
  "time",
  "macros",
  "fs",
], default-features = false }
hyper = { version = "0.14.32", features = [
  "server",
  "client",
  "http1",
  "http2",
  "tcp",
  "stream",
], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
anyhow = "1.0"
lazy_static = "1.5"
