[package]
name = "asr_module"
version = "0.1.0"
edition = "2021"

# 语音识别模块（SenseVoice sidecar，仅桌面端）
# 通过外部进程 sherpa-onnx-vad-with-offline-asr 完成 VAD 分段 + 非流式识别，
# 输出带时间轴的标准 SRT 字幕文件。本 crate 不依赖 whisper_module（其音频解码
# 走 ffmpeg 子进程，可处理 mp4 等容器格式）。

[dependencies]
slime_logger = { path = "../slime_logger" }
reqwest = { version = "0.12", features = ["blocking", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# 0.6 默认用纯 Rust 的 libbz2-rs-sys；0.5 走 C 绑定，macOS/iOS 链接找不到 _BZ2_* 符号
bzip2 = "0.6"
tar = "0.4"
