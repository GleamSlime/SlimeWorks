[package]
name = "whisper_module"
version = "0.1.0"
edition = "2021"

[features]
# GPU 加速特性（需要安装对应的 SDK）
# Vulkan: 需要安装 Vulkan SDK 并设置 VULKAN_SDK 环境变量（跨平台GPU，推荐）
# CUDA: 需要 NVIDIA CUDA Toolkit（仅NVIDIA GPU）
# 启用方式: cargo build --features vulkan 或 cargo build --features cuda
default = []
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]

[dependencies]
whisper-rs = "0.16"
symphonia = { version = "0.5", features = ["mp3", "flac", "aac", "ogg", "wav", "isomp4"] }
slime_logger = { path = "../slime_logger" }
db_module = { path = "../db_module" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"], default-features = false }
