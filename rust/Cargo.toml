[package]
name = "rust_lib_slime_works"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
lazy_static = "1.5.0"
slime_logger = { path = "slime_logger" }
# capture_proxy 使用动态加载，不再静态链接
reqwest = { version = "0.12", features = ["blocking"] }
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libloading = "0.8" # 动态库加载
chrono = { version = "0.4", features = ["serde"] }
md5 = "0.7" # MD5 校验
anyhow = "1.0" # 错误处理
sysinfo = "0.37"
base64 = "0.22"
url = "2"
regex = "1"
tokio = { version = "1.49.0", features = [
  "rt-multi-thread",
  "sync",
], default-features = false }

# hyper 用于节点服务器
hyper = { version = "0.14.32", features = [
  "server",
  "http1",
  "tcp",
  "stream",
], default-features = false }

dotenv = "0.15.0"

# 模块管理系统（独立 crate）
module_manager = { path = "module_manager" }

# WebSocket 模块（独立 crate）
ws_module = { path = "ws_module" }

# 数据库模块（独立 crate）
db_module = { path = "db_module" }

# Novel Reader 模块（独立 crate）
novel_reader = { path = "novel_reader" }

# 游戏库模块（独立 crate，迁移自 LunaBox）
game_library = { path = "game_library" }

# Media Collection 模块（独立 crate）
media_collection = { path = "media_collection" }

# HTTP Bridge 模块（独立 crate）
http_bridge = { path = "http_bridge" }

# 局域网传输模块（独立 crate）
lan_transfer = { path = "lan_transfer" }

# Manga 漫画平台模块（独立 crate）
manga_module = { path = "manga_module" }

# 解压工具模块（独立 crate）
extract_module = { path = "extract_module" }

# Sentry日志收集模块（独立 crate）
sentry_log = { path = "sentry_log" }

# 阿里云DDNS模块（独立 crate）
aliyun_module = { path = "aliyun_module" }

# 音乐播放器模块（独立 crate）
music_player = { path = "music_player" }

# NCM 解密模块（独立 crate）
ncm_decrypt = { path = "ncm_decrypt" }

# Whisper 语音识别模块（独立 crate）
whisper_module = { path = "whisper_module" }

[features]
default = []
# ffmpeg = ["ffmpeg_lib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = [
  "capture_proxy",
  "slime_logger",
  "media_collection",
  "novel_reader",
  "db_module",
  "game_library",
  "extract_module",
  "sentry_log",
  "aliyun_module",
  "music_player",
  "ncm_decrypt",
  "whisper_module",
  # "ffmpeg_lib",
]

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
  "processthreadsapi",
  "securitybaseapi",
  "winnt",
  "handleapi",
  "minwindef",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
