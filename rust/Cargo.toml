[package]
name = "rust_lib_slime_works"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
lazy_static = "1.5.0"
capture_proxy = { path = "capture_proxy" }
# ffmpeg_lib = { path = "ffmpeg_lib", optional = true }
tokio = { version = "1.49.0", features = [
  "rt-multi-thread",
  "sync",
], default-features = false }

[features]
default = []
# ffmpeg = ["ffmpeg_lib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
  "processthreadsapi",
  "securitybaseapi",
  "winnt",
  "handleapi",
  "minwindef",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
