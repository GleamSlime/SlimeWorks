[package]
name = "rust_lib_slime_works"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
lazy_static = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
capture_proxy = { path = "capture_proxy" }
ffmpeg_lib = { path = "ffmpeg_lib", optional = true }

[features]
default = []
ffmpeg = ["ffmpeg_lib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
