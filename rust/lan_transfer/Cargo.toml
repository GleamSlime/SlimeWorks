[package]
name = "lan_transfer"
version = "0.1.0"
edition = "2021"

[dependencies]
flutter_rust_bridge = "=2.11.1"
tokio = { version = "1.49.0", features = [
  "rt-multi-thread",
  "sync",
  "net",
  "io-util",
  "time",
  "macros",
  "fs",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.5"
slime_logger = { path = "../slime_logger" }
chrono = "0.4"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
# mDNS 服务发现
mdns-sd = "0.11"
# 异步通道
async-channel = "2.3"
# 文件哈希
sha2 = "0.10"
# 跨平台设备信息
hostname = "0.4"
# 本地网卡地址
if-addrs = "0.13"

[lib]
crate-type = ["staticlib", "rlib"]
