[package]
name = "db_module"
version = "0.1.0"
edition = "2021"

[dependencies]
# Flutter Rust Bridge
flutter_rust_bridge = "=2.11.1"

# 数据库 - redb 是纯 Rust 的嵌入式 key-value 数据库，性能优秀，支持 ACID
redb = "2.1"

# 异步运行时
tokio = { version = "1.49.0", features = [
  "rt-multi-thread",
  "sync",
], default-features = false }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 加密
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

# 工具
anyhow = "1.0"
thiserror = "1.0"
slime_logger = { path = "../slime_logger" }

[lib]
crate-type = ["staticlib", "rlib"]
