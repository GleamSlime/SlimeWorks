[package]
name = "ncm_decrypt"
version = "0.1.0"
edition = "2021"

[dependencies]
aes = "0.8"
cbc = "0.1"
ctr = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
base64 = "0.22"
walkdir = "2.5"
slime_logger = { path = "../slime_logger" }

[lib]
crate-type = ["staticlib", "rlib"]
