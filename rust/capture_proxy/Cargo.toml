[package]
name = "capture_proxy"
version = "0.1.0"
edition = "2021"

[lib]
name = "capture_proxy"
path = "src/lib.rs"

[[bin]]
name = "capture_proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.7"
encoding_rs = "0.8"
tokio-rustls = "0.23"
rustls = "0.20"
rcgen = "0.9"
rustls-native-certs = "0.6"
base64 = "0.21"
