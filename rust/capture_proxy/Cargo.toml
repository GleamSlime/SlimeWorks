[package]
name = "capture_proxy"
version = "0.1.0"
edition = "2021"

[lib]
name = "capture_proxy"
path = "src/lib.rs"

[[bin]]
name = "capture_proxy"
path = "src/main.rs"

[dependencies]
# 只启用必需的tokio features
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "sync",
  "time",
  "macros",
  "process",
  "fs",
], default-features = false }
# 只启用必需的hyper features
hyper = { version = "0.14", features = [
  "server",
  "client",
  "http1",
  "http2",
  "tcp",
  "stream",
], default-features = false }
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
regex = "1.7"
encoding_rs = "0.8"
tokio-rustls = { version = "0.23", default-features = false }
rustls = { version = "0.20", default-features = false, features = [
  "dangerous_configuration",
] }
rcgen = { version = "0.9", default-features = false, features = ["pem"] }
rustls-native-certs = "0.6"
base64 = "0.21"
rustls-pemfile = "1.0"
x509-parser = "0.14"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
