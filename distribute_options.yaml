output: dist/
variables:
  PGYER_API_KEY: ${PGYER_API_KEY}
releases:
  - name: release
    jobs:
      - name: release-macos
        package:
          platform: macos
          target: dmg
          build_args:
            release: true
      - name: release-windows
        package:
          platform: windows
          target: exe
          build_args:
            release: true
      - name: release-android
        package:
          platform: android
          target: apk
          build_args:
            release: true
        publish_to: pgyer
