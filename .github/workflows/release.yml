name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.0-0.0.pre"
  RUST_VERSION: "1.92.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: 提取版本号
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y%m%d")
          # 构建号格式：日期.commit短hash，例如 20260902.4752dad
          BUILD_NUMBER="${BUILD_DATE}.${COMMIT_SHORT}"
          TAG="v${VERSION}+${BUILD_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "📋 版本: $VERSION, 构建号: $BUILD_NUMBER, Tag: $TAG"

  # ===== test：Flutter 单元测试，出包前置闸门 =====
  # golden（像素比对）用例在这里排除：基准 PNG 是本机 macOS 渲染出来的，Linux runner
  # 的字体光栅化不同，像素必然对不上。这些用例的定位是"本机离屏肉眼验收"
  # （见 test/design_system_render_test.dart 顶部注释），不适合当 CI 断言。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master

      - name: Flutter 依赖 + 代码生成
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: 创建 .env 文件（占位）
        run: |
          cat > .env << 'ENVEOF'
          PICACG_API_KEY=ci-placeholder
          PICACG_SIGN_KEY=ci-placeholder
          ENVEOF

      - name: Flutter 单元测试
        run: flutter test --exclude-tags golden

  # ===== test-rust：Rust 单元测试，暂只观测不拦门 =====
  # 本机 `cargo test --workspace` 卡在 whisper-rs-sys（bindgen 找不到 libclang，
  # 需设 LIBCLANG_PATH），这套用例还没拿到跑通的实证，所以先不放进 needs 链里，
  # 免得一条没验证过的测试线把全平台出包堵死。连续绿了再改成拦门。
  test-rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo test --workspace
        working-directory: rust
        run: cargo test --workspace

  build-macos:
    needs: [detect-version, test]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master

      - name: Flutter 依赖 + 代码生成
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter precache --macos

      - name: 创建 .env 文件（占位）
        run: |
          cat > .env << 'ENVEOF'
          PICACG_API_KEY=${{ secrets.PICACG_API_KEY }}
          PICACG_SIGN_KEY=${{ secrets.PICACG_SIGN_KEY }}
          ENVEOF

      - name: 修复 CocoaPods 环境
        run: |
          brew uninstall cocoapods 2>/dev/null || true
          gem install cocoapods -n /usr/local/bin --no-document
          pod --version

      - name: 安装 CocoaPods 依赖
        working-directory: macos
        run: pod install --repo-update

      - name: 安装 appdmg
        run: npm install -g appdmg

      - name: 安装 fastforge
        run: dart pub global activate fastforge

      - name: 打包 macOS DMG
        env:
          PICACG_API_KEY: ${{ secrets.PICACG_API_KEY }}
          PICACG_SIGN_KEY: ${{ secrets.PICACG_SIGN_KEY }}
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fastforge package --platform macos --target dmg

      - name: Ad-hoc 代码签名
        run: |
          DMG_PATH=$(find dist/ -name "*.dmg" -type f | head -1)
          if [ -n "$DMG_PATH" ]; then
            codesign --force --deep --sign - "$DMG_PATH"
          fi

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/**/*.dmg
          retention-days: 7

  build-windows:
    needs: [detect-version, test]
    runs-on: windows-2022
    steps:
      - name: 配置 Git 支持 Unicode
        run: |
          git config --global core.quotepath false
          git config --global core.longpaths true
          git config --global core.autocrlf input

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master

      - name: Flutter 依赖 + 代码生成
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: 创建 .env 文件（占位）
        shell: bash
        run: |
          cat > .env << 'ENVEOF'
          PICACG_API_KEY=${{ secrets.PICACG_API_KEY }}
          PICACG_SIGN_KEY=${{ secrets.PICACG_SIGN_KEY }}
          ENVEOF

      - name: 安装 Inno Setup
        run: choco install innosetup -y

      - name: 下载 Inno Setup 中文语言文件（非官方翻译，不随安装包分发）
        run: |
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/refs/heads/main/Files/Languages/ChineseSimplified.isl" -OutFile "$langDir\ChineseSimplified.isl"
          if (Test-Path "$langDir\ChineseSimplified.isl") {
            echo "✅ 中文语言文件已就位"
          } else {
            echo "❌ 中文语言文件下载失败"
            exit 1
          }

      - name: 安装 fastforge
        run: dart pub global activate fastforge

      - name: 打包 Windows EXE
        env:
          PICACG_API_KEY: ${{ secrets.PICACG_API_KEY }}
          PICACG_SIGN_KEY: ${{ secrets.PICACG_SIGN_KEY }}
        run: |
          $env:Path += ";$env:LOCALAPPDATA\Pub\Cache\bin"
          fastforge package --platform windows --target exe

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/**/*.exe
          retention-days: 7

  # ===== build-ios：iOS 打包（Ad Hoc 签名 → 蒲公英分发） =====
  # 依赖 secrets：IOS_CERTIFICATE_P12 / IOS_CERTIFICATE_PASSWORD / IOS_KEYCHAIN_PASSWORD /
  #              IOS_PROVISIONING_PROFILE / IOS_TEAM_ID / IOS_BUNDLE_ID / PGYER_API_KEY
  # 注意：签名参数必须用 xcodebuild 命令行覆盖传入，不能只靠 -xcconfig（target 级设置优先级更高）
  # 本 job 不被 release / publish-pgyer 依赖，iOS 失败不会阻塞桌面端与安卓发布

  build-ios:
    needs: [detect-version, test]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 选择最新 Xcode（latest-stable；16.4 实验已证伪：exit 65 编译失败，工程依赖 Xcode 26 SDK）
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 打印实际版本：Podfile 已按 Xcode 26/27 把部署目标统一到 15.0，版本不符能一眼看出
      - name: 确认 Xcode 版本
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: 关闭 Spotlight 索引（防 mds 索引 DerivedData 导致 xcodebuild 假死）
        run: |
          sudo mdutil -a -i off 2>&1 || true
          sudo defaults write /.Spotlight-V100/VolumeConfiguration Exclusions -array "/Users/runner" 2>&1 || true

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ios-

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master

      - name: Flutter 依赖 + 代码生成
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: 创建 .env 文件
        run: |
          cat > .env << 'ENVEOF'
          PICACG_API_KEY=${{ secrets.PICACG_API_KEY }}
          PICACG_SIGN_KEY=${{ secrets.PICACG_SIGN_KEY }}
          ENVEOF

      - name: 预缓存 iOS 引擎（Flutter.xcframework）
        run: flutter precache --ios

      - name: 导入 Apple 证书到 Keychain
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$IOS_CERTIFICATE_P12" ]; then
            echo "❌ 未配置 IOS_CERTIFICATE_P12 secret，跳过签名步骤"
            exit 1
          fi
          # 诊断：只打长度不打内容，用于判断 secret 是否混进了空格/换行
          echo "=== secret 体检（只输出长度与指纹，不泄露明文）==="
          echo "IOS_CERTIFICATE_P12 原始长度=${#IOS_CERTIFICATE_P12}"
          echo "IOS_CERTIFICATE_PASSWORD 原始长度=${#IOS_CERTIFICATE_PASSWORD}"
          # secret 从文本里粘贴常带尾部换行/回车/CRLF，这里统一清掉再使用
          IOS_CERTIFICATE_P12=$(printf '%s' "$IOS_CERTIFICATE_P12" | tr -d ' \t\r\n')
          IOS_CERTIFICATE_PASSWORD=$(printf '%s' "$IOS_CERTIFICATE_PASSWORD" | tr -d '\r\n')
          echo "清理后：P12 长度=${#IOS_CERTIFICATE_P12}  PASSWORD 长度=${#IOS_CERTIFICATE_PASSWORD}"
          # 创建临时 Keychain 并设为默认
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # 把 build.keychain 加入搜索路径最前
          security list-keychains -d user -s build.keychain login.keychain
          # 导入 .p12 证书
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > certificate.p12
          echo "=== p12 文件信息 ==="
          ls -la certificate.p12
          file certificate.p12
          # SHA-256 可与本机 `shasum -a 256 ios-dist.p12` 直接对比，确认传上去的是哪一份
          echo "certificate.p12 SHA-256=$(shasum -a 256 certificate.p12 | awk '{print $1}')"
          security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # 允许 codesign 非交互访问私钥。分区列表必须带 codesign:，
          # 少了它 codesign 会弹 SecurityAgent 授权框，CI 无人值守 = 永久挂死。
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          # 关掉 keychain 自动锁定：新建的 keychain 默认 lock-on-sleep timeout=300s，
          # 编译空闲超过 5 分钟就回锁，下一个 codesign 同样弹框挂死。
          # 实测（security show-keychain-info）：不带任何参数调用 = no-timeout。
          security set-keychain-settings build.keychain
          security show-keychain-info build.keychain 2>&1 || true
          # 立即验证证书导入是否成功
          echo "=== 导入后 keychain 中的所有证书 ==="
          security find-certificate -a build.keychain || true
          echo "=== 可用 codesigning 身份 ==="
          IDENTITY_OUTPUT=$(security find-identity -p codesigning -v build.keychain)
          echo "$IDENTITY_OUTPUT"
          # 如果输出包含 "0 valid identities"，提前失败
          if echo "$IDENTITY_OUTPUT" | grep -q "0 valid identities"; then
            echo "❌ keychain 中没有可用的 codesigning 身份，证书导入失败"
            echo "可能原因："
            echo "1. IOS_CERTIFICATE_P12 base64 字符串有换行（在 GitHub Secret 中应该是一行连续字符串）"
            echo "2. IOS_CERTIFICATE_PASSWORD 与导出 .p12 时设置的密码不一致"
            echo "3. .p12 文件不包含私钥（导出时未展开证书查看私钥）"
            echo "4. .p12 是开发证书（iOS Development）而不是分发证书（iOS/Apple Distribution）"
            exit 1
          fi
          # 提取真实 identity 名称（形如 "Apple Distribution: xxx (TEAMID)" 或 "iPhone Distribution: xxx (TEAMID)"）
          # 后续 xcodebuild 用命令行覆盖 CODE_SIGN_IDENTITY，避免 target 里写死的 "Apple Development"
          SIGNING_IDENTITY=$(echo "$IDENTITY_OUTPUT" | sed -n 's/^[[:space:]]*[0-9]*)[[:space:]]*[A-Fa-f0-9]*[[:space:]]*"\(.*\)"$/\1/p' | head -1)
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "❌ 无法从 find-identity 输出中解析签名身份名称，请检查上面的输出格式"
            exit 1
          fi
          echo "✅ 使用的签名身份: $SIGNING_IDENTITY"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV

      - name: 导入 Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$IOS_PROVISIONING_PROFILE" ]; then
            echo "❌ 未配置 IOS_PROVISIONING_PROFILE secret"
            exit 1
          fi
          PP_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PP_DIR"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PP_DIR/profile.mobileprovision"
          # 解码 mobileprovision（PKCS#7 签名格式）为 plist 临时文件
          security cms -D -i "$PP_DIR/profile.mobileprovision" > /tmp/profile.plist
          # 提取 UUID 和 Name（codesign 通过 UUID 文件名查找 profile）
          PP_UUID=$(plutil -extract UUID raw -o - /tmp/profile.plist)
          PP_NAME=$(plutil -extract Name raw -o - /tmp/profile.plist)
          # 打印过期时间：profile 过期是 CI 上最常见的静默签名失败原因之一
          PP_EXPIRY=$(plutil -extract ExpirationDate raw -o - /tmp/profile.plist 2>/dev/null || echo "(该 profile 无 ExpirationDate)")
          # 打印 profile 授权的能力清单：app 的 entitlements 必须是它的子集，
          # 缺哪个键 archive 就会报 "X capabilities are present in the app's entitlements, but not in the profile"
          echo "=== Profile 授权的 Entitlements keys ==="
          plutil -extract Entitlements xml1 -o - /tmp/profile.plist | grep -E "<key>" || echo "(无 Entitlements)"
          rm -f /tmp/profile.plist
          if [ -z "$PP_UUID" ]; then
            echo "❌ 未能从 profile 中提取 UUID，请检查 IOS_PROVISIONING_PROFILE 是否为单行连续 base64、且是 .mobileprovision 文件"
            exit 1
          fi
          # 用 UUID 重命名（codesign 按文件名匹配）
          mv "$PP_DIR/profile.mobileprovision" "$PP_DIR/${PP_UUID}.mobileprovision"
          echo "PP_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "PP_NAME=$PP_NAME" >> $GITHUB_ENV
          echo "Profile UUID: $PP_UUID"
          echo "Profile Name: $PP_NAME"
          echo "Profile 过期时间: $PP_EXPIRY"

      # 与 build-macos 保持一致：GitHub macos-15 runner 预装的 cocoapods 会加载失败
      - name: 修复 CocoaPods 环境
        run: |
          brew uninstall cocoapods 2>/dev/null || true
          gem install cocoapods -n /usr/local/bin --no-document
          pod --version

      - name: 安装 CocoaPods 依赖
        working-directory: ios
        run: pod install --repo-update

      - name: 验证证书可用性
        env:
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          # 列出当前 keychain 搜索路径
          echo "=== Keychain search list ==="
          security list-keychains -d user
          # 确认临时 keychain 在搜索路径最前
          security list-keychains -d user -s build.keychain login.keychain
          security list-keychains -d user
          # 解锁 keychain（archive 时如果 keychain 锁住会报 User interaction is not allowed）
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          # 列出可用于 codesigning 的 identity（确认证书已导入且私钥可访问）
          echo "=== Available signing identities ==="
          security find-identity -p codesigning -v build.keychain
          # 显示 keychain 中所有证书的 Common Name（确认证书类型）
          echo "=== All certificates in keychain ==="
          security find-certificate -a build.keychain | grep -E '"labl"|"cnam"' || true

      - name: Xcode archive（生成 .xcarchive）
        # 挂起保护：正常冷编译约 20~40 分钟，超 45 分钟按失败处理，避免烧满 6 小时
        timeout-minutes: 45
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          PP_UUID: ${{ env.PP_UUID }}
        run: |
          # 解锁 keychain 确保私钥可访问
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" build.keychain
          # 列出可用 codesigning 身份，辅助诊断
          echo "=== Available signing identities ==="
          security find-identity -p codesigning -v build.keychain || true
          # codesign 预检：私钥不可非交互使用时，codesign 会挂在一个无法应答的授权框上
          # （表现为 xcodebuild 0% CPU 卡到 action timeout，实测浪费过 45 分钟）。
          # 先签一个空壳可执行文件探一次：只有"超时不返回"才判失败并立即退出，
          # 返回非零码只告警不中断（Distribution 证书签 CLI 二进制偶发报错不该挡射出包）。
          printf 'int main(void){return 0;}\n' > /tmp/sigcheck.c
          clang -arch arm64 /tmp/sigcheck.c -o /tmp/sigcheck 2>/dev/null || echo "⚠️ 预检二进制编译失败，跳过预检"
          if [ -f /tmp/sigcheck ]; then
            codesign --force --sign "$SIGNING_IDENTITY" /tmp/sigcheck >/tmp/sigcheck.log 2>&1 &
            CS_PID=$!
            WAITED=0
            while kill -0 $CS_PID 2>/dev/null; do
              if [ "$WAITED" -ge 120 ]; then
                echo "❌ codesign 预检 120 秒未返回 → 私钥被 GUI 授权框挡住，继续跑也一定会挂死"
                echo "--- 当前 keychain 设置 ---"; security show-keychain-info build.keychain 2>&1 || true
                echo "--- SecurityAgent 进程 ---"; pgrep -fl SecurityAgent || echo "(无)"
                kill -9 $CS_PID 2>/dev/null || true
                exit 1
              fi
              sleep 5; WAITED=$((WAITED + 5))
            done
            if wait $CS_PID; then
              echo "✅ codesign 预检通过（私钥可非交互使用）"
            else
              echo "⚠️ codesign 预检返回非零，仅告警："; cat /tmp/sigcheck.log
            fi
          fi
          # 签名参数必须走 xcodebuild 命令行覆盖（优先级最高）。
          # 用 -xcconfig 无效：ios/Runner.xcodeproj 的 target 级设置
          #   CODE_SIGN_STYLE=Automatic / CODE_SIGN_IDENTITY="Apple Development" / DEVELOPMENT_TEAM
          # 会覆盖 -xcconfig，导致仍按 automatic + 开发证书签名而失败。
          # PROVISIONING_PROFILE_SPECIFIER 用 profile 的 UUID（与文件名一致，匹配最稳）。
          # 显式钉死 entitlements：工程里没有 Runner.entitlements，Xcode 会自行合成，
          # 结果多出一个 aps-environment（Push），而两个 Ad Hoc profile 都不含该授权 →
          # archive 报 "Push Notifications capabilities are present in the app's entitlements,
          # but not in the profile"。
          # 本工程没有任何 APNs/推送代码，给一份空 entitlements 即可消除这个不确定性。
          cat > Runner/CIAdHoc.entitlements << 'EOLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          EOLEOF
          # 后台 CPU 监控：每 60 秒打印一次占用最高的进程，
          # 用于判断卡住时是真在编译（clang/swift 高 CPU）还是死锁（全员 0%）
          # 附带磁盘余量检查：macOS runner 磁盘打满会让链接阶段假死
          ( while true; do
              echo "===== $(date '+%H:%M:%S') CPU 快照 ====="
              ps aux | sort -nrk 3 | head -8
              echo "--- 链接/编译进程状态（STAT 含 U/R 为可疑，%CPU=0 且长期不变=挂起）---"
              ps -axo pid,stat,%cpu,time,comm | grep -E "ld$|clang|dsymutil|swift" | grep -v grep | head -10 || true
              echo "--- xcodebuild 进程树（它和它的直接子进程，判断在等谁）---"
              XPID=$(pgrep -x xcodebuild | head -1) || true
              if [ -n "$XPID" ]; then
                ps -axo pid,ppid,stat,%cpu,time,comm | awk -v p="$XPID" '$1==p || $2==p' || true
              fi
              echo "--- Flutter/Dart/脚本进程 ---"
              pgrep -fl "flutter|dart|xcode_backend" | head -5 || true
              df -h /System/Volumes/Data | tail -1
              sleep 60
            done ) & MON_PID=$!
          mkdir -p build
          set +e
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Runner.xcarchive \
            "CODE_SIGN_STYLE=Manual" \
            "CODE_SIGN_IDENTITY=${SIGNING_IDENTITY}" \
            "DEVELOPMENT_TEAM=${IOS_TEAM_ID}" \
            "PROVISIONING_PROFILE_SPECIFIER=${PP_UUID}" \
            "CODE_SIGN_ENTITLEMENTS=Runner/CIAdHoc.entitlements" \
            "CLANG_ENABLE_EXPLICIT_MODULES=NO" \
            "SWIFT_ENABLE_EXPLICIT_MODULES=NO"
          ARCHIVE_EXIT=$?
          kill $MON_PID 2>/dev/null || true
          set -e
          if [ $ARCHIVE_EXIT -ne 0 ]; then
            echo "❌ xcodebuild archive 失败，退出码 $ARCHIVE_EXIT"
            exit $ARCHIVE_EXIT
          fi

      - name: 生成 ExportOptions.plist
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          PP_UUID: ${{ env.PP_UUID }}
        run: |
          BUNDLE_ID="${IOS_BUNDLE_ID:-com.gleamslime.works}"
          # provisioningProfiles 的值用 profile UUID；bitcode 相关键在 Xcode 14+ 已废弃，不再写
          cat > ios/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>release-testing</string>
              <key>teamID</key>
              <string>${IOS_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PP_UUID}</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Xcode exportArchive（生成 IPA）
        env:
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          # exportArchive 会重新签名，keychain 锁住时报 errSecInteractionNotAllowed
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath ios/build/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist
          ls -la build/ios/ipa

      - name: 上传到蒲公英
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          PGYER_USER_KEY: ${{ secrets.PGYER_USER_KEY }}
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ 未找到 IPA 文件"
            exit 1
          fi
          if [ -z "$PGYER_USER_KEY" ]; then
            echo "❌ 未配置 PGYER_USER_KEY secret（蒲公英控制台 https://www.pgyer.com/account/api 的 User Key）"
            exit 1
          fi
          echo "📦 上传到蒲公英: $IPA_PATH"
          # 走 apiv1（与本地 scripts/publish_ios.py 一致）：
          # apiv2/app/upload 在本账号返回 code=1 Missing parameters "password"，
          # apiv1/app/upload 用 uKey + _api_key 可以正常上传。
          RESPONSE=$(curl -s -F "file=@${IPA_PATH}" \
            -F "uKey=${PGYER_USER_KEY}" \
            -F "_api_key=${PGYER_API_KEY}" \
            -F "updateDescription=GitHub Actions 自动构建" \
            https://upload.pgyer.com/apiv1/app/upload)
          echo "📋 蒲公英响应: $RESPONSE"
          CODE=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('code', -1))" 2>/dev/null || echo "-1")
          if [ "$CODE" = "0" ]; then
            SHORT=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('data',{}).get('appShortcutUrl',''))" 2>/dev/null || echo "")
            echo "✅ 蒲公英上传成功: https://www.pgyer.com/${SHORT}"
          else
            MSG=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('message','未知错误'))" 2>/dev/null || echo "响应不是合法 JSON")
            echo "❌ 蒲公英上传失败: $MSG"
            exit 1
          fi

      - name: 清理 Keychain
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -f certificate.p12

      - name: 上传 iOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7

  build-android:
    needs: [detect-version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Flutter 依赖 + 代码生成
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: 创建 .env 文件
        run: |
          cat > .env << 'ENVEOF'
          PICACG_API_KEY=${{ secrets.PICACG_API_KEY }}
          PICACG_SIGN_KEY=${{ secrets.PICACG_SIGN_KEY }}
          ENVEOF

      - name: 打包 Android APK
        env:
          PICACG_API_KEY: ${{ secrets.PICACG_API_KEY }}
          PICACG_SIGN_KEY: ${{ secrets.PICACG_SIGN_KEY }}
        run: flutter build apk --release

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  publish-pgyer:
    needs: [detect-version, test, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk/

      - name: 上传到蒲公英
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
        run: |
          APK_PATH=$(find apk/ -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ 未找到 APK 文件"
            exit 1
          fi
          echo "📦 上传到蒲公英: $APK_PATH"
          RESPONSE=$(curl -s -F "file=@${APK_PATH}" \
            -F "_api_key=${PGYER_API_KEY}" \
            -F "buildInstallType=2" \
            https://www.pgyer.com/apiv2/app/upload)
          echo "📋 蒲公英响应: $RESPONSE"
          CODE=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('code', -1))" 2>/dev/null || echo "-1")
          if [ "$CODE" = "0" ]; then
            echo "✅ 蒲公英上传成功"
          else
            echo "⚠️ 蒲公英上传可能失败，请检查响应"
          fi

  release:
    needs: [detect-version, test, build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: 列出产物
        run: find dist/ -type f | head -20

      - name: 获取 DMG 文件信息
        id: dmg-info
        run: |
          DMG_PATH=$(find dist/ -name "*.dmg" -type f | head -1)
          FILE_SIZE=0
          if [ -n "$DMG_PATH" ]; then
            FILE_SIZE=$(stat -c%s "$DMG_PATH" 2>/dev/null || echo "0")
          fi
          echo "file_size=$FILE_SIZE" >> "$GITHUB_OUTPUT"

      - name: 生成 Release 正文（本次推送的提交清单）
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          BUILD="${{ needs.detect-version.outputs.build_number }}"
          SHA="${{ github.sha }}"
          BEFORE="${{ github.event.before || '' }}"
          # 提交范围优先取"本次推送"（push 事件自带的 before SHA）；
          # 取不到（新分支首推 / 强推 / 手动触发）就退回上一个 tag，再退回当前单个提交。
          if [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${SHA}"
            SOURCE="本次推送"
          else
            PREV_TAG=$(git describe --tags --abbrev=0 "${SHA}^" 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              RANGE="${PREV_TAG}..${SHA}"
              SOURCE="自 ${PREV_TAG} 起"
            else
              RANGE="$SHA"
              SOURCE="当前提交"
            fi
          fi
          TOTAL=$(git rev-list --count --no-merges "$RANGE" 2>/dev/null || echo 0)
          {
            echo "## SlimeWorks v${VERSION}"
            echo
            echo "构建号：${BUILD}"
            echo
            echo "### 提交记录（${SOURCE}，${TOTAL} 个非合并提交）"
            echo
            if [ "$TOTAL" = "0" ]; then
              echo "_没有新提交（本次多为文档或构建配置改动）。_"
            else
              git log --no-merges --reverse --pretty='- `%h` %s' "$RANGE" | head -80
              if [ "$TOTAL" -gt 80 ]; then
                echo "- …另有 $((TOTAL - 80)) 个提交未列出"
              fi
            fi
            echo
            echo '### 下载'
            echo
            echo '- **macOS**：`.dmg`，拖进「应用程序」'
            echo '- **Windows**：`.exe` 安装包'
            echo '- **Android**：`.apk`（蒲公英同步有包）'
            echo '- **iOS**：`.ipa`（Ad Hoc，测试机 UDID 需已登记进描述文件）'
          } > release_body.md
          cat release_body.md

      - name: 创建或更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.tag }}
          name: "SlimeWorks v${{ needs.detect-version.outputs.version }}"
          body_path: release_body.md
          files: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.apk
            dist/**/*.ipa
          draft: false
          prerelease: false

      - name: 更新 appcast.xml
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          BUILD_NUMBER="${{ needs.detect-version.outputs.build_number }}"
          # Sparkle 要求单调递增的整数版本号，使用 GitHub run_number 保证唯一递增
          SPARKLE_VERSION="${{ github.run_number }}"
          FILE_SIZE="${{ steps.dmg-info.outputs.file_size }}"
          TAG="${{ needs.detect-version.outputs.tag }}"
          REPO="GleamSlime/SlimeWorks"
          DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")

          DMG_FILENAME=$(find dist/ -name "*.dmg" -type f -exec basename {} \; | head -1)

          cat > docs/appcast.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/rss-sparkle-1.0">
            <channel>
              <title>SlimeWorks</title>
              <language>zh-CN</language>
              <link>https://github.com/${REPO}</link>
              <item>
                <title>${VERSION}</title>
                <description>
                  <![CDATA[Auto build v${VERSION}+${BUILD_NUMBER}]]>
                </description>
                <pubDate>${DATE}</pubDate>
                <enclosure
                  url="https://github.com/${REPO}/releases/download/${TAG}/${DMG_FILENAME}"
                  sparkle:version="${SPARKLE_VERSION}"
                  sparkle:shortVersionString="${VERSION}"
                  sparkle:edSignature=""
                  length="${FILE_SIZE}"
                  type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF

      - name: 提交 appcast.xml 到 main 分支
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: 更新 appcast.xml for ${{ needs.detect-version.outputs.tag }}"
          file_pattern: docs/appcast.xml
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
