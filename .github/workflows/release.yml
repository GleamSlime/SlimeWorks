name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"
  RUST_VERSION: "1.92.0"
  # GitHub 托管 runner 在境外，统一走官方源；lock 的 url 已指向 pub.dev，
  # 配合 pub get --enforce-lockfile 严格按 lock 版本与 hash 取包，不符直接失败。
  PUB_HOSTED_URL: "https://pub.dev"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: 提取版本号
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y%m%d")
          # 构建号格式：日期.commit短hash，例如 20260902.4752dad
          BUILD_NUMBER="${BUILD_DATE}.${COMMIT_SHORT}"
          TAG="v${VERSION}+${BUILD_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "📋 版本: $VERSION, 构建号: $BUILD_NUMBER, Tag: $TAG"

  # ===== test：Flutter 单元测试，出包前置闸门 =====
  # golden（像素比对）用例在这里排除：基准 PNG 是本机 macOS 渲染出来的，Linux runner
  # 的字体光栅化不同，像素必然对不上。这些用例的定位是"本机离屏肉眼验收"
  # （见 test/design_system_render_test.dart 顶部注释），不适合当 CI 断言。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Flutter 依赖 + 代码生成
        shell: bash
        run: |
          # enforce-lockfile：严格按 lock 的版本与 hash 取包，不符直接失败
          flutter pub get --enforce-lockfile
          # 描边图标是构建期产物，*.g.dart 不入库，缺了它编译直接断
          # build_runner 在构建脚本刚生成/变化时会以 75 要求重跑：仅 75 重试一次
          for attempt in 1 2; do
            if flutter pub run build_runner build --delete-conflicting-outputs; then
              break
            else
              status=$?
              if [ "$status" -ne 75 ] || [ "$attempt" -eq 2 ]; then
                exit "$status"
              fi
            fi
          done
          dart run tool/stroke_icons/generate.dart

      - name: 创建 .env 文件（占位）
        run: |
          cat > .env << 'ENVEOF'
          PICACG_API_KEY=ci-placeholder
          PICACG_SIGN_KEY=ci-placeholder
          ENVEOF

      - name: Flutter 单元测试
        run: |
          # 日志下载要仓库管理员权限，失败时把报错原文推成注解，公开 API 也读得到。
          # [E] 那行只写"See exception logs above"，真正的报错在它前面的行里，所以往
          # 前多取 30 行；同一条失败的区间自动合并，不重复出注解。
          status=0
          flutter test --exclude-tags golden --reporter expanded > test.log 2>&1 || status=$?
          cat test.log
          if [ $status -ne 0 ]; then
            python3 - <<'PY'
          import re
          lines = open('test.log', encoding='utf-8', errors='replace').read().splitlines()
          spans = [(max(0, i - 30), min(len(lines), i + 6)) for i, l in enumerate(lines)
                   if '[E]' in l and re.match(r'\s*\d\d:\d\d', l)]
          merged = []
          for lo, hi in spans:
              if merged and lo <= merged[-1][1]:
                  merged[-1][1] = max(merged[-1][1], hi)
              else:
                  merged.append([lo, hi])
          for lo, hi in merged:
              block = '\n'.join(lines[lo:hi])[-1800:]
              esc = block.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print('::error::' + esc)
          PY
          fi
          exit $status

  # ===== test-rust：Rust 单元测试，暂只观测不拦门 =====
  # whisper-rs-sys 的 build script 用 bindgen，必须能拿到 libclang；cargokit 只在
  # Windows 桌面构建时注入 LIBCLANG_PATH，所以裸跑 cargo test 要自己解析并导出。
  # 路径不能写死（runner 上 Xcode 目录带版本号），从 xcode-select -p 现取。
  # 这套用例仍未拿到 CI 跑通的实证，所以先不放进 needs 链里，
  # 免得一条没验证过的测试线把全平台出包堵死。连续绿了再改成拦门。
  test-rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 定位 libclang（bindgen 依赖）
        run: |
          CANDIDATES=()
          if DEV_DIR=$(xcode-select -p 2>/dev/null); then
            CANDIDATES+=("$DEV_DIR/Toolchains/XcodeDefault.xctoolchain/usr/lib")
          fi
          CANDIDATES+=("/Library/Developer/CommandLineTools/usr/lib")
          FOUND=""
          for d in "${CANDIDATES[@]}"; do
            if ls "$d"/libclang*.dylib >/dev/null 2>&1; then FOUND="$d"; break; fi
          done
          if [ -z "$FOUND" ]; then
            echo "❌ 未找到 libclang.dylib"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "(无 Xcode.app)"
            exit 1
          fi
          echo "LIBCLANG_PATH=$FOUND" >> "$GITHUB_ENV"
          echo "✅ LIBCLANG_PATH=$FOUND"

      - name: cargo test --workspace
        working-directory: rust
        run: cargo test --workspace --no-fail-fast

  build-macos:
    needs: [detect-version, test]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Flutter 依赖 + 代码生成
        shell: bash
        run: |
          # enforce-lockfile：严格按 lock 的版本与 hash 取包，不符直接失败
          flutter pub get --enforce-lockfile
          # 描边图标是构建期产物，*.g.dart 不入库，缺了它编译直接断
          # build_runner 在构建脚本刚生成/变化时会以 75 要求重跑：仅 75 重试一次
          for attempt in 1 2; do
            if flutter pub run build_runner build --delete-conflicting-outputs; then
              break
            else
              status=$?
              if [ "$status" -ne 75 ] || [ "$attempt" -eq 2 ]; then
                exit "$status"
              fi
            fi
          done
          dart run tool/stroke_icons/generate.dart
          flutter precache --macos

      - name: 写入 CI 构建信息
        shell: bash
        run: |
          # 构建号直接取 detect-version 的输出：各 job 自己算日期/哈希会在跨零点时
          # 与 Release tag 对不上；buildCode 是更新比较用的纯数字（GitHub run_number）。
          # 直接整份重写 build_info.dart（BSD/GNU sed 的 -i 语法不通用）。
          BUILD_NUMBER="${{ needs.detect-version.outputs.build_number }}"
          BUILD_CODE="${{ github.run_number }}"
          BUILD_TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d %H:%M UTC+8")
          cat > lib/core/build_info.dart <<EOF
          /// CI 打包信息：由 release.yml"写入 CI 构建信息"步骤在打包前生成。
          /// 本地开发构建仓库里这份保持空串，关于页回退显示 pubspec 构建号。
          class CiBuildInfo {
          CiBuildInfo._();
          /// CI 构建号，格式 YYYYMMDD.commit短hash（与 GitHub Release tag 一致）
          static const String buildNumber = '${BUILD_NUMBER}';
          /// CI 数字构建号（GitHub run_number），与 appcast 的 sparkle:version 一致
          static const String buildCode = '${BUILD_CODE}';
          /// CI 打包时间（北京时间 UTC+8）
          static const String buildTime = '${BUILD_TIME}';
          }
          EOF
          grep "static const" lib/core/build_info.dart

      - name: 覆盖 CI 构建号
        run: |
          # 构建号统一用 run_number：macOS 的 CFBundleVersion 与 appcast 的
          # sparkle:version 必须同源，否则装完最新版仍会被判定有新版本
          VERSION="${{ needs.detect-version.outputs.version }}"
          BUILD_CODE="${{ github.run_number }}"
          sed -i '' -E "s/^version: .*/version: ${VERSION}+${BUILD_CODE}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: 创建 .env 文件（占位）
        run: |
          cat > .env << 'ENVEOF'
          PICACG_API_KEY=${{ secrets.PICACG_API_KEY }}
          PICACG_SIGN_KEY=${{ secrets.PICACG_SIGN_KEY }}
          ENVEOF

      - name: 修复 CocoaPods 环境
        run: |
          brew uninstall cocoapods 2>/dev/null || true
          gem install cocoapods -n /usr/local/bin --no-document
          pod --version

      # libmpv tarball 跨 run 复用：GitHub Releases 偶发降级/限流时（实测 runner 只拿到
      # 92 字节错误页而本地能正常下到 16MB），有这个缓存就能直接跳过下载。
      # key 里带 Makefile 的版本号+校验和，上游换版本会自动失效重建。
      - name: 缓存 libmpv tarball（macOS）
        uses: actions/cache@v4
        with:
          path: ~/.cache/slimeworks-libmpv/macos
          key: libmpv-macos-v0.6.0-84d2ad98

      # 与 iOS 同源：media_kit_libs_macos_video 的 podspec 也是 `system("make")`，
      # 每次 pod install 都要从 GitHub Releases 拉 libmpv tarball 并校验 SHA256，
      # 没有重试、返回值也没人检查。断流时下载会得到错误页 → 校验 FAILED →
      # Frameworks/ 不生成 → 静默拖到链接期才炸（ld: framework 'Mpv' not found）。
      - name: 预拉 libmpv xcframework（带重试）
        working-directory: macos
        run: |
          # 与 build-ios 完全同源的逻辑（同一套 libmpv-darwin-build Makefile），
          # 详细背景见 build-ios 里的同名步骤注释。要点：上游 curl 没带 -f，
          # GitHub 降级时会把错误页当成 tarball 写盘，校验失败后 `system("make")`
          # 的返回值又没人检查，最终静默拖到链接期才报 `ld: framework 'Mpv' not found`。
          PKG_DIR=$(ls -d "$HOME"/.pub-cache/hosted/pub.dev/media_kit_libs_macos_video-*/macos | tail -1)
          if [ -z "$PKG_DIR" ] || [ ! -f "$PKG_DIR/Makefile" ]; then
            echo "⚠️ 找不到 media_kit_libs_macos_video 包目录，交给 pod install 自己处理"
            exit 0
          fi
          echo "包目录: $PKG_DIR"
          VER=$(grep -oE 'MPV_XCFRAMEWORKS_VERSION=.*' "$PKG_DIR/Makefile" | cut -d= -f2 | tr -d '[:space:]')
          SHA=$(grep -oE 'MPV_XCFRAMEWORKS_SHA256SUM=.*' "$PKG_DIR/Makefile" | cut -d= -f2 | tr -d '[:space:]')
          URL="https://github.com/media-kit/libmpv-darwin-build/releases/download/${VER}/libmpv-xcframeworks_${VER}_macos-universal-video-default.tar.gz"
          echo "版本: $VER"
          echo "期望 SHA256: $SHA"
          CACHE_DIR="$PKG_DIR/.cache/xcframeworks"
          TARGET="$CACHE_DIR/libmpv-xcframeworks-${VER}-macos-universal.tar.gz"
          mkdir -p "$CACHE_DIR"
          # 优先用 actions/cache 里跨 run 复用的 tarball（GitHub 降级时的保险）
          PERSIST="$HOME/.cache/slimeworks-libmpv/macos/libmpv.tar.gz"
          if [ -f "$PERSIST" ] && [ "$(shasum -a 256 "$PERSIST" | cut -d' ' -f1)" = "$SHA" ]; then
            echo "✅ 命中持久化缓存（$PERSIST），跳过下载"
            cp "$PERSIST" "$TARGET"
          fi
          if [ -f "$TARGET" ] && [ "$(shasum -a 256 "$TARGET" | cut -d' ' -f1)" = "$SHA" ]; then
            echo "✅ 已有校验通过的产物，跳过下载"
          else
            OK=0
            for attempt in 1 2 3 4 5 6; do
              echo "--- 第 $attempt 次尝试下载 ---"
              if curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 300 \
                   "$URL" -o "$CACHE_DIR/dl.tmp"; then
                SIZE=$(wc -c < "$CACHE_DIR/dl.tmp" | tr -d ' ')
                ACTUAL=$(shasum -a 256 "$CACHE_DIR/dl.tmp" | cut -d' ' -f1)
                echo "下载大小: ${SIZE}B / 实际 SHA256: $ACTUAL"
                if [ "$ACTUAL" = "$SHA" ]; then
                  mv "$CACHE_DIR/dl.tmp" "$TARGET"
                  mkdir -p "$(dirname "$PERSIST")"
                  cp "$TARGET" "$PERSIST" 2>/dev/null || true
                  echo "✅ 校验通过"
                  OK=1
                  break
                fi
                echo "⚠️ 校验不匹配（典型是 GitHub 降级返回的错误页，正常产物约 16MB）"
              else
                echo "⚠️ curl 失败（HTTP 错误或超时）"
              fi
              rm -f "$CACHE_DIR/dl.tmp"
              if [ "$attempt" -lt 6 ]; then
                WAIT=$(( attempt * 30 ))
                [ "$WAIT" -gt 300 ] && WAIT=300
                echo "等待 ${WAIT}s 后重试……"
                sleep $WAIT
              fi
            done
            if [ "$OK" -ne 1 ]; then
              echo "❌ 连续 6 次拉取 libmpv 失败（GitHub Releases 不可达/降级）"
              echo "这是外部服务问题，不是代码问题；稍后重跑即可。"
              exit 1
            fi
          fi
          ln -sf "libmpv-xcframeworks-${VER}-macos-universal.tar.gz" \
                 "$CACHE_DIR/libmpv-xcframeworks-macos-universal.tar.gz"
          touch "$TARGET"
          ( cd "$PKG_DIR" && make ) || true
          if [ ! -d "$PKG_DIR/Frameworks/Mpv.xcframework" ]; then
            echo "❌ Frameworks/Mpv.xcframework 仍不存在（tarball 已下载但解包/建链失败）"
            ls -la "$PKG_DIR/Frameworks" 2>/dev/null || true
            exit 1
          fi
          echo "✅ libmpv xcframework 就绪"

      - name: 安装 CocoaPods 依赖
        working-directory: macos
        run: |
          pod install --repo-update
          # libmpv 没下来时 pod install 照样"成功"，报错要等链接期才出现。当场查一次。
          # 路径按候选列表逐个找：不同 Flutter 版本/工程形态下 symlink 位置不完全一样
          # （ios/.symlinks 或 macos/.symlinks，插件目录大小写也有差异），
          # 写死单一路径会把「已经就绪」误判成「不存在」。
          MPV_FW=""
          for cand in \
            ".symlinks/plugins/media_kit_libs_macos_video/macos/Frameworks/Mpv.xcframework" \
            "../.symlinks/plugins/media_kit_libs_macos_video/macos/Frameworks/Mpv.xcframework" \
            "Pods/Mpv.xcframework"; do
            if [ -d "$cand" ]; then MPV_FW="$cand"; break; fi
          done
          # 兜底：实在找不到就按包缓存里的产物判断（上一阶段已校验过它）
          if [ -z "$MPV_FW" ]; then
            PKG_DIR=$(ls -d "$HOME"/.pub-cache/hosted/pub.dev/media_kit_libs_macos_video-*/macos | tail -1)
            if [ -n "$PKG_DIR" ] && [ -d "$PKG_DIR/Frameworks/Mpv.xcframework" ]; then
              MPV_FW="$PKG_DIR/Frameworks/Mpv.xcframework（pub-cache）"
            fi
          fi
          if [ -z "$MPV_FW" ]; then
            echo "❌ Mpv.xcframework 不存在：libmpv 下载/校验失败（见上一步 make 输出）"
            ls -la .symlinks/plugins/media_kit_libs_macos_video/macos/Frameworks 2>/dev/null || true
            ls -la ../.symlinks/plugins/media_kit_libs_macos_video/macos/Frameworks 2>/dev/null || true
            exit 1
          fi
          echo "✅ Mpv.xcframework 就绪: $MPV_FW"

      - name: 安装 appdmg
        run: npm install -g appdmg

      - name: 安装 fastforge
        run: dart pub global activate fastforge

      - name: 打包 macOS DMG
        env:
          PICACG_API_KEY: ${{ secrets.PICACG_API_KEY }}
          PICACG_SIGN_KEY: ${{ secrets.PICACG_SIGN_KEY }}
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fastforge package --platform macos --target dmg

      - name: 稳定身份代码签名（保住系统权限授权）
        env:
          MAC_SIGN_IDENTITY_P12: ${{ secrets.MAC_SIGN_IDENTITY_P12 }}
          MAC_SIGN_IDENTITY_PASSWORD: ${{ secrets.MAC_SIGN_IDENTITY_PASSWORD }}
          MAC_SIGN_IDENTITY_NAME: ${{ secrets.MAC_SIGN_IDENTITY_NAME }}
        run: |
          # TCC 授权（完全磁盘访问/外置卷）按签名身份记录：ad-hoc 每次构建 CDHash 都变，
          # 用户每次更新后都要重授权限。改用 CI 固定的自签证书（scripts/make_mac_signing_cert.sh
          # 一次性生成，填 MAC_SIGN_IDENTITY_* secrets），身份跨版本不变，授权得以保留。
          DMG_PATH=$(find dist/ -name "*.dmg" -type f | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "::error::未找到 DMG"
            exit 1
          fi
          if [ -z "$MAC_SIGN_IDENTITY_P12" ] || [ -z "$MAC_SIGN_IDENTITY_NAME" ]; then
            # 用 error 而不是 warning：ad-hoc 签名会让用户每次更新后被 macOS
            # 重新索要「完全磁盘访问」等 TCC 权限（授权按签名身份记录，ad-hoc
            # 每次构建 CDHash 都变 = 每次都被当成另一个 App）。
            # 这是一条会长期困扰用户的真实缺陷，不该淹没在 warning 里。
            echo "::error::未配置 MAC_SIGN_IDENTITY_* secrets —— 产物将是 ad-hoc 签名，"
            echo "::error::用户每次自动更新后都要重新授予磁盘权限。"
            echo "::error::先跑 scripts/make_mac_signing_cert.sh 生成自签证书，把"
            echo "::error::P12/PASSWORD/NAME 三项填进仓库 Secrets，再重跑本 job。"
            codesign --force --deep --sign - "$DMG_PATH"
            exit 0
          fi
          # 临时钥匙串：分区列表必须带 codesign:，否则 codesign 弹授权框 CI 挂死（同 iOS job 教训）
          KC="$RUNNER_TEMP/sign.keychain-db"
          KCPASS=$(uuidgen)
          security create-keychain -p "$KCPASS" "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -t 1800 "$KC"
          printf '%s' "$MAC_SIGN_IDENTITY_P12" | tr -d ' \t\r\n' | base64 --decode > "$RUNNER_TEMP/signer.p12"
          # 导入前先看 p12 的加密算法。OpenSSL 3.x 起 `pkcs12 -export` 的默认算法变成
          # PBES2/PBKDF2/AES-256-CBC，而 macOS 的 security import 解析不了，会报
          #   MAC verification failed during PKCS12 import (wrong password?)
          # ——文案说"口令错误"，但口令往往是完全正确的，真因是算法不被支持。
          # 这个报错极具误导性（会把排查引向检查 secret 有没有填错），已在 macOS 实测复现：
          #   OpenSSL3 默认格式 → 失败；传统格式（3DES/SHA1）→ 1 identity imported。
          # 这里直接就地转换，而不是报错让人去重新生成 secret：
          # ① 口令本来就在 secret 里，CI 完全有能力自己转；
          # ② 重导出不会改变证书身份（实测 SHA256 指纹逐字节一致），
          #    用户的 TCC 授权（完全磁盘访问/外置卷）不受影响，不需要换证书。
          # 注意 openssl 的 -info 输出走 stderr，必须 2>&1 才能 grep 到。
          if openssl pkcs12 -in "$RUNNER_TEMP/signer.p12" -info -noout \
               -passin pass:"$MAC_SIGN_IDENTITY_PASSWORD" 2>&1 | grep -q "PBES2"; then
            echo "⚠️ p12 为 PBES2/AES 加密（OpenSSL 3 默认），macOS 不支持；就地转为传统格式"
            if openssl pkcs12 -in "$RUNNER_TEMP/signer.p12" -nodes \
                 -passin pass:"$MAC_SIGN_IDENTITY_PASSWORD" -out "$RUNNER_TEMP/signer.pem" 2>/dev/null; then
              openssl pkcs12 -export -out "$RUNNER_TEMP/signer.legacy.p12" \
                -in "$RUNNER_TEMP/signer.pem" \
                -passout pass:"$MAC_SIGN_IDENTITY_PASSWORD" \
                -name "$MAC_SIGN_IDENTITY_NAME" \
                -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
              mv "$RUNNER_TEMP/signer.legacy.p12" "$RUNNER_TEMP/signer.p12"
              rm -f "$RUNNER_TEMP/signer.pem"
              echo "✅ 已转为传统格式（证书身份不变）"
            else
              echo "::error::p12 解密失败：MAC_SIGN_IDENTITY_PASSWORD 与 p12 口令不一致"
              exit 1
            fi
          fi
          security import "$RUNNER_TEMP/signer.p12" -k "$KC" -P "$MAC_SIGN_IDENTITY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null 2>&1
          rm -f "$RUNNER_TEMP/signer.p12"
          # 把 .app 从 DMG 里取出来重签，再重造 DMG：容器签名不影响 App 身份，App 才要紧
          MOUNT="$RUNNER_TEMP/dmg_mount"
          hdiutil attach "$DMG_PATH" -nobrowse -mountpoint "$MOUNT" >/dev/null
          APP_DIR=$(find "$MOUNT" -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "::error::DMG 内未找到 .app"
            hdiutil detach "$MOUNT" -quiet || true
            exit 1
          fi
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE"
          ditto "$APP_DIR" "$STAGE/"
          hdiutil detach "$MOUNT" -quiet
          APP_NAME=$(basename "$APP_DIR")
          codesign --force --deep --sign "$MAC_SIGN_IDENTITY_NAME" \
            --entitlements macos/Runner/Release.entitlements \
            --timestamp=none "$STAGE/$APP_NAME"
          echo "重签结果："
          codesign -dv "$STAGE/$APP_NAME" 2>&1 | head -6
          ln -s /Applications "$STAGE/Applications"
          rm -f "$DMG_PATH"
          hdiutil create -srcfolder "$STAGE" -volname "史莱姆工坊" -format UDZO "$DMG_PATH" >/dev/null
          # DMG 容器本身 ad-hoc 签一层即可（Sparkle EdDSA 步骤随后会覆盖字节级校验）
          codesign --force --deep --sign - "$DMG_PATH"

      - name: Sparkle EdDSA 签名
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::缺少 SPARKLE_PRIVATE_KEY secret：需放入 generate_keys -x 导出的私钥内容，否则 Sparkle 会判定更新未正确签名"
            exit 1
          fi
          DMG_PATH=$(find dist/ -name "*.dmg" -type f | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "::error::未找到 DMG，无法签名"
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/sparkle_private_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          SIGN_TOOL=$(find macos/Pods -name sign_update -type f | head -1)
          if [ -z "$SIGN_TOOL" ]; then
            echo "::error::pod install 后未找到 Sparkle 的 sign_update"
            exit 1
          fi
          # 必须在 Ad-hoc 代码签名之后：codesign 会改动 DMG 字节，先签就验不过
          "$SIGN_TOOL" --ed-key-file "$KEY_FILE" -p "$DMG_PATH" > dist/sparkle_ed_signature.txt
          rm -f "$KEY_FILE"
          echo "✅ EdDSA 签名: $(cat dist/sparkle_ed_signature.txt)"

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/**/*.dmg
          retention-days: 7

      - name: 上传 Sparkle 签名
        uses: actions/upload-artifact@v4
        with:
          name: sparkle-signature
          path: dist/sparkle_ed_signature.txt
          retention-days: 7

  build-windows:
    needs: [detect-version, test]
    runs-on: windows-2022
    steps:
      - name: 配置 Git 支持 Unicode
        run: |
          git config --global core.quotepath false
          git config --global core.longpaths true
          git config --global core.autocrlf input

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Flutter 依赖 + 代码生成
        shell: bash
        run: |
          # enforce-lockfile：严格按 lock 的版本与 hash 取包，不符直接失败
          flutter pub get --enforce-lockfile
          # 描边图标是构建期产物，*.g.dart 不入库，缺了它编译直接断
          # build_runner 在构建脚本刚生成/变化时会以 75 要求重跑：仅 75 重试一次
          for attempt in 1 2; do
            if flutter pub run build_runner build --delete-conflicting-outputs; then
              break
            else
              status=$?
              if [ "$status" -ne 75 ] || [ "$attempt" -eq 2 ]; then
                exit "$status"
              fi
            fi
          done
          dart run tool/stroke_icons/generate.dart

      - name: 写入 CI 构建信息
        shell: bash
        run: |
          # 构建号直接取 detect-version 的输出：各 job 自己算日期/哈希会在跨零点时
          # 与 Release tag 对不上；buildCode 是更新比较用的纯数字（GitHub run_number）。
          # 直接整份重写 build_info.dart（BSD/GNU sed 的 -i 语法不通用）。
          BUILD_NUMBER="${{ needs.detect-version.outputs.build_number }}"
          BUILD_CODE="${{ github.run_number }}"
          BUILD_TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d %H:%M UTC+8")
          cat > lib/core/build_info.dart <<EOF
          /// CI 打包信息：由 release.yml"写入 CI 构建信息"步骤在打包前生成。
          /// 本地开发构建仓库里这份保持空串，关于页回退显示 pubspec 构建号。
          class CiBuildInfo {
          CiBuildInfo._();
          /// CI 构建号，格式 YYYYMMDD.commit短hash（与 GitHub Release tag 一致）
          static const String buildNumber = '${BUILD_NUMBER}';
          /// CI 数字构建号（GitHub run_number），与 appcast 的 sparkle:version 一致
          static const String buildCode = '${BUILD_CODE}';
          /// CI 打包时间（北京时间 UTC+8）
          static const String buildTime = '${BUILD_TIME}';
          }
          EOF
          grep "static const" lib/core/build_info.dart

      - name: 覆盖 CI 构建号
        shell: bash
        run: |
          # 构建号统一用 run_number：Windows 文件版本与 appcast 的
          # sparkle:version 必须同源，否则装完最新版仍会被判定有新版本
          VERSION="${{ needs.detect-version.outputs.version }}"
          BUILD_CODE="${{ github.run_number }}"
          sed -i -E "s/^version: .*/version: ${VERSION}+${BUILD_CODE}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: 创建 .env 文件（占位）
        shell: bash
        run: |
          cat > .env << 'ENVEOF'
          PICACG_API_KEY=${{ secrets.PICACG_API_KEY }}
          PICACG_SIGN_KEY=${{ secrets.PICACG_SIGN_KEY }}
          ENVEOF

      - name: 安装 Inno Setup
        run: choco install innosetup -y

      - name: 下载 Inno Setup 中文语言文件（非官方翻译，不随安装包分发）
        run: |
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/refs/heads/main/Files/Languages/ChineseSimplified.isl" -OutFile "$langDir\ChineseSimplified.isl"
          if (Test-Path "$langDir\ChineseSimplified.isl") {
            echo "✅ 中文语言文件已就位"
          } else {
            echo "❌ 中文语言文件下载失败"
            exit 1
          }

      - name: 安装 fastforge
        run: dart pub global activate fastforge

      - name: 打包 Windows EXE
        env:
          PICACG_API_KEY: ${{ secrets.PICACG_API_KEY }}
          PICACG_SIGN_KEY: ${{ secrets.PICACG_SIGN_KEY }}
        run: |
          $env:Path += ";$env:LOCALAPPDATA\Pub\Cache\bin"
          fastforge package --platform windows --target exe

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/**/*.exe
          retention-days: 7

  # ===== build-ios：iOS 打包（Ad Hoc 签名 → 蒲公英分发） =====
  # 依赖 secrets：IOS_CERTIFICATE_P12 / IOS_CERTIFICATE_PASSWORD / IOS_KEYCHAIN_PASSWORD /
  #              IOS_PROVISIONING_PROFILE / IOS_TEAM_ID / IOS_BUNDLE_ID / PGYER_API_KEY
  # 注意：签名参数必须用 xcodebuild 命令行覆盖传入，不能只靠 -xcconfig（target 级设置优先级更高）
  # 本 job 不被 release / publish-pgyer 依赖，iOS 失败不会阻塞桌面端与安卓发布

  build-ios:
    needs: [detect-version, test]
    runs-on: macos-15
    env:
      # 3.47.5 起 stable 通道默认开启 SPM（3.41 及以前是默认关的）。开启后 podhelper 会把
      # 带 Package.swift 的插件从 Pods 里摘掉，而本 job 用裸 xcodebuild archive 出包，
      # 工程从未做过 SPM 集成（迁移只发生在 flutter build ios 里），这批模块就两边都没有，
      # archive 直接 fatal error: module 'audio_session' not found（退出码 65）。
      # 钉死走 CocoaPods，与仓库里 ios/Podfile.lock 的形态一致。
      FLUTTER_SWIFT_PACKAGE_MANAGER: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          # 蒲公英上传步骤生成"版本更新描述"要回溯提交范围（与 Release 正文同源）
          fetch-depth: 0

      - name: 选择最新 Xcode（latest-stable；16.4 实验已证伪：exit 65 编译失败，工程依赖 Xcode 26 SDK）
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 打印实际版本：Podfile 已按 Xcode 26/27 把部署目标统一到 15.0，版本不符能一眼看出
      - name: 确认 Xcode 版本
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: 关闭 Spotlight 索引（防 mds 索引 DerivedData 导致 xcodebuild 假死）
        run: |
          sudo mdutil -a -i off 2>&1 || true
          sudo defaults write /.Spotlight-V100/VolumeConfiguration Exclusions -array "/Users/runner" 2>&1 || true

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ios-

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Flutter 依赖 + 代码生成
        shell: bash
        run: |
          # enforce-lockfile：严格按 lock 的版本与 hash 取包，不符直接失败
          flutter pub get --enforce-lockfile
          # 描边图标是构建期产物，*.g.dart 不入库，缺了它编译直接断
          # build_runner 在构建脚本刚生成/变化时会以 75 要求重跑：仅 75 重试一次
          for attempt in 1 2; do
            if flutter pub run build_runner build --delete-conflicting-outputs; then
              break
            else
              status=$?
              if [ "$status" -ne 75 ] || [ "$attempt" -eq 2 ]; then
                exit "$status"
              fi
            fi
          done
          dart run tool/stroke_icons/generate.dart

      - name: 写入 CI 构建信息
        shell: bash
        run: |
          # 构建号直接取 detect-version 的输出：各 job 自己算日期/哈希会在跨零点时
          # 与 Release tag 对不上；buildCode 是更新比较用的纯数字（GitHub run_number）。
          # 直接整份重写 build_info.dart（BSD/GNU sed 的 -i 语法不通用）。
          BUILD_NUMBER="${{ needs.detect-version.outputs.build_number }}"
          BUILD_CODE="${{ github.run_number }}"
          BUILD_TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d %H:%M UTC+8")
          cat > lib/core/build_info.dart <<EOF
          /// CI 打包信息：由 release.yml"写入 CI 构建信息"步骤在打包前生成。
          /// 本地开发构建仓库里这份保持空串，关于页回退显示 pubspec 构建号。
          class CiBuildInfo {
          CiBuildInfo._();
          /// CI 构建号，格式 YYYYMMDD.commit短hash（与 GitHub Release tag 一致）
          static const String buildNumber = '${BUILD_NUMBER}';
          /// CI 数字构建号（GitHub run_number），与 appcast 的 sparkle:version 一致
          static const String buildCode = '${BUILD_CODE}';
          /// CI 打包时间（北京时间 UTC+8）
          static const String buildTime = '${BUILD_TIME}';
          }
          EOF
          grep "static const" lib/core/build_info.dart

      - name: 创建 .env 文件
        run: |
          cat > .env << 'ENVEOF'
          PICACG_API_KEY=${{ secrets.PICACG_API_KEY }}
          PICACG_SIGN_KEY=${{ secrets.PICACG_SIGN_KEY }}
          ENVEOF

      - name: 预缓存 iOS 引擎（Flutter.xcframework）
        run: flutter precache --ios

      - name: 导入 Apple 证书到 Keychain
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$IOS_CERTIFICATE_P12" ]; then
            echo "❌ 未配置 IOS_CERTIFICATE_P12 secret，跳过签名步骤"
            exit 1
          fi
          # 诊断：只打长度不打内容，用于判断 secret 是否混进了空格/换行
          echo "=== secret 体检（只输出长度与指纹，不泄露明文）==="
          echo "IOS_CERTIFICATE_P12 原始长度=${#IOS_CERTIFICATE_P12}"
          echo "IOS_CERTIFICATE_PASSWORD 原始长度=${#IOS_CERTIFICATE_PASSWORD}"
          # secret 从文本里粘贴常带尾部换行/回车/CRLF，这里统一清掉再使用
          IOS_CERTIFICATE_P12=$(printf '%s' "$IOS_CERTIFICATE_P12" | tr -d ' \t\r\n')
          IOS_CERTIFICATE_PASSWORD=$(printf '%s' "$IOS_CERTIFICATE_PASSWORD" | tr -d '\r\n')
          echo "清理后：P12 长度=${#IOS_CERTIFICATE_P12}  PASSWORD 长度=${#IOS_CERTIFICATE_PASSWORD}"
          # 创建临时 Keychain 并设为默认
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # 把 build.keychain 加入搜索路径最前
          security list-keychains -d user -s build.keychain login.keychain
          # 导入 .p12 证书
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > certificate.p12
          echo "=== p12 文件信息 ==="
          ls -la certificate.p12
          file certificate.p12
          # SHA-256 可与本机 `shasum -a 256 ios-dist.p12` 直接对比，确认传上去的是哪一份
          echo "certificate.p12 SHA-256=$(shasum -a 256 certificate.p12 | awk '{print $1}')"
          # 与 build-macos 同源处理：OpenSSL 3 默认导出的 PBES2/AES p12，macOS security import
          # 读不了，会报 "MAC verification failed during PKCS12 import (wrong password?)"
          # ——文案甩锅给口令，实际是算法不支持。既然口令就在 secret 里，就地转格式即可；
          # 重导出不改变证书身份，已装设备上的描述文件/信任不受影响。
          if openssl pkcs12 -in certificate.p12 -info -noout \
               -passin pass:"$IOS_CERTIFICATE_PASSWORD" 2>&1 | grep -q "PBES2"; then
            echo "⚠️ iOS p12 为 PBES2/AES 加密，macOS 不支持；就地转为传统格式"
            if openssl pkcs12 -in certificate.p12 -nodes \
                 -passin pass:"$IOS_CERTIFICATE_PASSWORD" -out cert.pem.tmp 2>/dev/null; then
              openssl pkcs12 -export -out certificate.legacy.p12 -in cert.pem.tmp \
                -passout pass:"$IOS_CERTIFICATE_PASSWORD" \
                -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
              mv certificate.legacy.p12 certificate.p12
              rm -f cert.pem.tmp
              echo "✅ 已转为传统格式（证书身份不变）"
            else
              echo "❌ p12 解密失败：IOS_CERTIFICATE_PASSWORD 与 p12 口令不一致"
              exit 1
            fi
          fi
          security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # 允许 codesign 非交互访问私钥。分区列表必须带 codesign:，
          # 少了它 codesign 会弹 SecurityAgent 授权框，CI 无人值守 = 永久挂死。
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          # 关掉 keychain 自动锁定：新建的 keychain 默认 lock-on-sleep timeout=300s，
          # 编译空闲超过 5 分钟就回锁，下一个 codesign 同样弹框挂死。
          # 实测（security show-keychain-info）：不带任何参数调用 = no-timeout。
          security set-keychain-settings build.keychain
          security show-keychain-info build.keychain 2>&1 || true
          # 立即验证证书导入是否成功
          echo "=== 导入后 keychain 中的所有证书 ==="
          security find-certificate -a build.keychain || true
          echo "=== 可用 codesigning 身份 ==="
          IDENTITY_OUTPUT=$(security find-identity -p codesigning -v build.keychain)
          echo "$IDENTITY_OUTPUT"
          # 如果输出包含 "0 valid identities"，提前失败
          if echo "$IDENTITY_OUTPUT" | grep -q "0 valid identities"; then
            echo "❌ keychain 中没有可用的 codesigning 身份，证书导入失败"
            echo "可能原因："
            echo "1. IOS_CERTIFICATE_P12 base64 字符串有换行（在 GitHub Secret 中应该是一行连续字符串）"
            echo "2. IOS_CERTIFICATE_PASSWORD 与导出 .p12 时设置的密码不一致"
            echo "3. .p12 文件不包含私钥（导出时未展开证书查看私钥）"
            echo "4. .p12 是开发证书（iOS Development）而不是分发证书（iOS/Apple Distribution）"
            exit 1
          fi
          # 提取真实 identity 名称（形如 "Apple Distribution: xxx (TEAMID)" 或 "iPhone Distribution: xxx (TEAMID)"）
          # 后续 xcodebuild 用命令行覆盖 CODE_SIGN_IDENTITY，避免 target 里写死的 "Apple Development"
          SIGNING_IDENTITY=$(echo "$IDENTITY_OUTPUT" | sed -n 's/^[[:space:]]*[0-9]*)[[:space:]]*[A-Fa-f0-9]*[[:space:]]*"\(.*\)"$/\1/p' | head -1)
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "❌ 无法从 find-identity 输出中解析签名身份名称，请检查上面的输出格式"
            exit 1
          fi
          echo "✅ 使用的签名身份: $SIGNING_IDENTITY"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV

      - name: 导入 Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$IOS_PROVISIONING_PROFILE" ]; then
            echo "❌ 未配置 IOS_PROVISIONING_PROFILE secret"
            exit 1
          fi
          PP_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PP_DIR"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PP_DIR/profile.mobileprovision"
          # 解码 mobileprovision（PKCS#7 签名格式）为 plist 临时文件
          security cms -D -i "$PP_DIR/profile.mobileprovision" > /tmp/profile.plist
          # 提取 UUID 和 Name（codesign 通过 UUID 文件名查找 profile）
          PP_UUID=$(plutil -extract UUID raw -o - /tmp/profile.plist)
          PP_NAME=$(plutil -extract Name raw -o - /tmp/profile.plist)
          # 打印过期时间：profile 过期是 CI 上最常见的静默签名失败原因之一
          PP_EXPIRY=$(plutil -extract ExpirationDate raw -o - /tmp/profile.plist 2>/dev/null || echo "(该 profile 无 ExpirationDate)")
          # 打印 profile 授权的能力清单：app 的 entitlements 必须是它的子集，
          # 缺哪个键 archive 就会报 "X capabilities are present in the app's entitlements, but not in the profile"
          echo "=== Profile 授权的 Entitlements keys ==="
          plutil -extract Entitlements xml1 -o - /tmp/profile.plist | grep -E "<key>" || echo "(无 Entitlements)"
          rm -f /tmp/profile.plist
          if [ -z "$PP_UUID" ]; then
            echo "❌ 未能从 profile 中提取 UUID，请检查 IOS_PROVISIONING_PROFILE 是否为单行连续 base64、且是 .mobileprovision 文件"
            exit 1
          fi
          # 用 UUID 重命名（codesign 按文件名匹配）
          mv "$PP_DIR/profile.mobileprovision" "$PP_DIR/${PP_UUID}.mobileprovision"
          echo "PP_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "PP_NAME=$PP_NAME" >> $GITHUB_ENV
          echo "Profile UUID: $PP_UUID"
          echo "Profile Name: $PP_NAME"
          echo "Profile 过期时间: $PP_EXPIRY"

      # Xcode 版本由上面的 setup-xcode(latest-stable) 决定，当前解析到 26.3（SDK iphoneos26.2）。
      # 不要再手动 xcode-select 覆盖：runner 上 /Applications/Xcode.app 实为 16.4，
      # 其 iOS 18.5 SDK 缺少 NSProcessInfo.isiOSAppOnVision（device_info_plus 12.4.0 依赖的 iOS 26 API），
      # 一旦切到 16.4 就会 exit 65。原先为对齐本地 27.x 的手动切换步骤已删除。
      # audio_session 的 "module not found" 已由本 job 的 FLUTTER_SWIFT_PACKAGE_MANAGER=false 解决，无需再降/换 Xcode。

      # 与 build-macos 保持一致：GitHub macos-15 runner 预装的 cocoapods 会加载失败
      - name: 修复 CocoaPods 环境
        run: |
          brew uninstall cocoapods 2>/dev/null || true
          gem install cocoapods -n /usr/local/bin --no-document
          pod --version

      # 同 macOS：跨 run 复用 tarball，避免被 GitHub Releases 的降级/限流卡住。
      - name: 缓存 libmpv tarball（iOS）
        uses: actions/cache@v4
        with:
          path: ~/.cache/slimeworks-libmpv/ios
          key: libmpv-ios-v0.6.0-a95bc185

      - name: 预拉 libmpv xcframework（带重试）
        working-directory: ios
        run: |
          # media_kit_libs_ios_video 的 podspec 第一行是 `system("make")`，每次 pod install
          # 都会去 GitHub Releases 下一个 19.8MB 的 libmpv tarball 并校验 SHA256。
          # 该下载**没有任何重试**，而且 `system()` 的返回值没人检查：
          #   · GitHub 降级/限流时 curl 会把一个 92 字节的错误页当成功写进 .tmp，
          #   · shasum 校验 FAILED → make 退出 1 → Frameworks/ 根本没生成，
          #   · 这个失败被完全静默吞掉，要一直拖到 archive 链接阶段才暴露成
          #     「ld: framework 'Mpv' not found」+ exit 65，白烧 40 分钟。
          # 这里自己下载并按 Makefile 的缓存布局放好，让 pod install 里的 make 直接命中
          # （Makefile 只看文件是否存在，实测命中 0.01s），过程完全可控。
          #
          # 为什么不用 `make` 直接重试：上游 curl 没带 -f，错误响应体会被当成文件；
          # 真失败时每轮都要重跑最慢的「下载 10 秒超时 + 校验」，且 GitHub 降级通常是
          # 持续几分钟到几十分钟的，短间隔重试只是空转。这里自己控测速+退避。
          PKG_DIR=$(ls -d "$HOME"/.pub-cache/hosted/pub.dev/media_kit_libs_ios_video-*/ios | tail -1)
          if [ -z "$PKG_DIR" ] || [ ! -f "$PKG_DIR/Makefile" ]; then
            echo "⚠️ 找不到 media_kit_libs_ios_video 包目录，交给 pod install 自己处理"
            exit 0
          fi
          echo "包目录: $PKG_DIR"
          VER=$(grep -oE 'MPV_XCFRAMEWORKS_VERSION=.*' "$PKG_DIR/Makefile" | cut -d= -f2 | tr -d '[:space:]')
          SHA=$(grep -oE 'MPV_XCFRAMEWORKS_SHA256SUM=.*' "$PKG_DIR/Makefile" | cut -d= -f2 | tr -d '[:space:]')
          URL="https://github.com/media-kit/libmpv-darwin-build/releases/download/${VER}/libmpv-xcframeworks_${VER}_ios-universal-video-default.tar.gz"
          echo "版本: $VER"
          echo "期望 SHA256: $SHA"
          CACHE_DIR="$PKG_DIR/.cache/xcframeworks"
          TARGET="$CACHE_DIR/libmpv-xcframeworks-${VER}-ios-universal.tar.gz"
          mkdir -p "$CACHE_DIR"
          # 优先用 actions/cache 里跨 run 复用的 tarball（GitHub 降级时的保险）
          PERSIST="$HOME/.cache/slimeworks-libmpv/ios/libmpv.tar.gz"
          if [ -f "$PERSIST" ] && [ "$(shasum -a 256 "$PERSIST" | cut -d' ' -f1)" = "$SHA" ]; then
            echo "✅ 命中持久化缓存（$PERSIST），跳过下载"
            cp "$PERSIST" "$TARGET"
          fi
          # 已经就绪（比如 restore 了缓存）就不用再下
          if [ -f "$TARGET" ] && [ "$(shasum -a 256 "$TARGET" | cut -d' ' -f1)" = "$SHA" ]; then
            echo "✅ 已有校验通过的产物，跳过下载"
          else
            OK=0
            for attempt in 1 2 3 4 5 6; do
              echo "--- 第 $attempt 次尝试下载 ---"
              # -f：HTTP 4xx/5xx 直接失败，不会把错误页当文件（上游 curl 就缺这个）
              # --retry：curl 自己处理连接层抖动，比外面重跑整条链路省事
              if curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 300 \
                   "$URL" -o "$CACHE_DIR/dl.tmp"; then
                SIZE=$(wc -c < "$CACHE_DIR/dl.tmp" | tr -d ' ')
                ACTUAL=$(shasum -a 256 "$CACHE_DIR/dl.tmp" | cut -d' ' -f1)
                echo "下载大小: ${SIZE}B / 实际 SHA256: $ACTUAL"
                if [ "$ACTUAL" = "$SHA" ]; then
                  mv "$CACHE_DIR/dl.tmp" "$TARGET"
                  mkdir -p "$(dirname "$PERSIST")"
                  cp "$TARGET" "$PERSIST" 2>/dev/null || true
                  echo "✅ 校验通过"
                  OK=1
                  break
                fi
                echo "⚠️ 校验不匹配（典型是 GitHub 降级返回的错误页，正常产物约 20MB）"
              else
                echo "⚠️ curl 失败（HTTP 错误或超时）"
              fi
              rm -f "$CACHE_DIR/dl.tmp"
              if [ "$attempt" -lt 6 ]; then
                # 退避 30/60/120/240/300s：GitHub 的降级窗口通常以分钟计，
                # 短间隔重试只会持续撞在同一个窗口上。
                WAIT=$(( attempt * 30 ))
                [ "$WAIT" -gt 300 ] && WAIT=300
                echo "等待 ${WAIT}s 后重试……"
                sleep $WAIT
              fi
            done
            if [ "$OK" -ne 1 ]; then
              echo "❌ 连续 6 次拉取 libmpv 失败（GitHub Releases 不可达/降级）"
              echo "这是外部服务问题，不是代码问题；稍后重跑即可。"
              exit 1
            fi
          fi
          # 还要把 Makefile 认的符号链接和正式文件名补齐，否则 make 会认为缓存未命中。
          # （Makefile 的规则名是 libmpv-xcframeworks-ios-universal.tar.gz，指向带版本号的真文件）
          ln -sf "libmpv-xcframeworks-${VER}-ios-universal.tar.gz" \
                 "$CACHE_DIR/libmpv-xcframeworks-ios-universal.tar.gz"
          touch "$TARGET"
          ( cd "$PKG_DIR" && make ) || true
          # 产物必须真的存在：Frameworks/Mpv.xcframework 在，链接期才不会找不着框架
          if [ ! -d "$PKG_DIR/Frameworks/Mpv.xcframework" ]; then
            echo "❌ Frameworks/Mpv.xcframework 仍不存在（tarball 已下载但解包/建链失败）"
            ls -la "$PKG_DIR/Frameworks" 2>/dev/null || true
            exit 1
          fi
          echo "✅ libmpv xcframework 就绪"

      - name: 安装 CocoaPods 依赖
        working-directory: ios
        run: |
          pod install --repo-update
          # 早失败探针：形态错配原本要等 archive 跑 30~40 分钟才以 module not found 暴露。
          # ① SPM 开着时，18 个带 Package.swift 的插件不进 Pods；
          # ② 工程若被本地 `flutter build ios` 自动迁移成 SPM（pbxproj 里有生成包引用）又被
          #    提交上来，本 job 的 CocoaPods 路线会与之冲突（工具没有反向迁移）。
          # 两种都当场红，别拖到 archive。
          if ! grep -q "^  - audio_session " Podfile.lock; then
            echo "❌ audio_session 没进 Pods：SPM 没被关住（见本 job 的 FLUTTER_SWIFT_PACKAGE_MANAGER）"
            exit 1
          fi
          if grep -q "FlutterGeneratedPluginSwiftPackage" Runner.xcodeproj/project.pbxproj; then
            echo "❌ iOS 工程已迁移到 SPM，与本 job 的 CocoaPods 路线冲突：回退工程迁移，或改走 flutter build ios --config-only"
            exit 1
          fi
          # ③ libmpv 没下来时 pod install 照样"成功"，报错要等 archive 链接期才出现
          #    （ld: framework 'Mpv' not found）。这里当场查一次，省掉那 40 分钟。
          # 路径按候选列表逐个找：不同 Flutter 版本/工程形态下 symlink 位置不完全一样
          # （ios/.symlinks 或 ios/../.symlinks），写死单一路径会把「已经就绪」误判成「不存在」。
          MPV_FW=""
          for cand in \
            ".symlinks/plugins/media_kit_libs_ios_video/ios/Frameworks/Mpv.xcframework" \
            "../.symlinks/plugins/media_kit_libs_ios_video/ios/Frameworks/Mpv.xcframework" \
            "Pods/Mpv.xcframework"; do
            if [ -d "$cand" ]; then MPV_FW="$cand"; break; fi
          done
          # 兜底：按 pub-cache 里的产物判断（上一阶段已校验并解包过它）
          if [ -z "$MPV_FW" ]; then
            PKG_DIR=$(ls -d "$HOME"/.pub-cache/hosted/pub.dev/media_kit_libs_ios_video-*/ios | tail -1)
            if [ -n "$PKG_DIR" ] && [ -d "$PKG_DIR/Frameworks/Mpv.xcframework" ]; then
              MPV_FW="$PKG_DIR/Frameworks/Mpv.xcframework（pub-cache）"
            fi
          fi
          if [ -z "$MPV_FW" ]; then
            echo "❌ Mpv.xcframework 不存在：libmpv 下载/校验失败（见上一步 make 输出）"
            ls -la .symlinks/plugins/media_kit_libs_ios_video/ios/Frameworks 2>/dev/null || true
            ls -la ../.symlinks/plugins/media_kit_libs_ios_video/ios/Frameworks 2>/dev/null || true
            exit 1
          fi
          echo "✅ Mpv.xcframework 就绪: $MPV_FW"
          echo "✅ Pods 形态正常（插件全进 Pods，工程未做 SPM 迁移）"

      - name: 验证证书可用性
        env:
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          # 列出当前 keychain 搜索路径
          echo "=== Keychain search list ==="
          security list-keychains -d user
          # 确认临时 keychain 在搜索路径最前
          security list-keychains -d user -s build.keychain login.keychain
          security list-keychains -d user
          # 解锁 keychain（archive 时如果 keychain 锁住会报 User interaction is not allowed）
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          # 列出可用于 codesigning 的 identity（确认证书已导入且私钥可访问）
          echo "=== Available signing identities ==="
          security find-identity -p codesigning -v build.keychain
          # 显示 keychain 中所有证书的 Common Name（确认证书类型）
          echo "=== All certificates in keychain ==="
          security find-certificate -a build.keychain | grep -E '"labl"|"cnam"' || true

      - name: Xcode archive（生成 .xcarchive）
        # 挂起保护：正常冷编译约 20~40 分钟，超 45 分钟按失败处理，避免烧满 6 小时
        timeout-minutes: 45
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          PP_UUID: ${{ env.PP_UUID }}
        run: |
          # 解锁 keychain 确保私钥可访问
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" build.keychain
          # 列出可用 codesigning 身份，辅助诊断
          echo "=== Available signing identities ==="
          security find-identity -p codesigning -v build.keychain || true
          # codesign 预检：私钥不可非交互使用时，codesign 会挂在一个无法应答的授权框上
          # （表现为 xcodebuild 0% CPU 卡到 action timeout，实测浪费过 45 分钟）。
          # 先签一个空壳可执行文件探一次：只有"超时不返回"才判失败并立即退出，
          # 返回非零码只告警不中断（Distribution 证书签 CLI 二进制偶发报错不该挡射出包）。
          printf 'int main(void){return 0;}\n' > /tmp/sigcheck.c
          clang -arch arm64 /tmp/sigcheck.c -o /tmp/sigcheck 2>/dev/null || echo "⚠️ 预检二进制编译失败，跳过预检"
          if [ -f /tmp/sigcheck ]; then
            codesign --force --sign "$SIGNING_IDENTITY" /tmp/sigcheck >/tmp/sigcheck.log 2>&1 &
            CS_PID=$!
            WAITED=0
            while kill -0 $CS_PID 2>/dev/null; do
              if [ "$WAITED" -ge 120 ]; then
                echo "❌ codesign 预检 120 秒未返回 → 私钥被 GUI 授权框挡住，继续跑也一定会挂死"
                echo "--- 当前 keychain 设置 ---"; security show-keychain-info build.keychain 2>&1 || true
                echo "--- SecurityAgent 进程 ---"; pgrep -fl SecurityAgent || echo "(无)"
                kill -9 $CS_PID 2>/dev/null || true
                exit 1
              fi
              sleep 5; WAITED=$((WAITED + 5))
            done
            if wait $CS_PID; then
              echo "✅ codesign 预检通过（私钥可非交互使用）"
            else
              echo "⚠️ codesign 预检返回非零，仅告警："; cat /tmp/sigcheck.log
            fi
          fi
          # 签名参数必须走 xcodebuild 命令行覆盖（优先级最高）。
          # 用 -xcconfig 无效：ios/Runner.xcodeproj 的 target 级设置
          #   CODE_SIGN_STYLE=Automatic / CODE_SIGN_IDENTITY="Apple Development" / DEVELOPMENT_TEAM
          # 会覆盖 -xcconfig，导致仍按 automatic + 开发证书签名而失败。
          # PROVISIONING_PROFILE_SPECIFIER 用 profile 的 UUID（与文件名一致，匹配最稳）。
          # 显式钉死 entitlements：工程里没有 Runner.entitlements，Xcode 会自行合成，
          # 结果多出一个 aps-environment（Push），而两个 Ad Hoc profile 都不含该授权 →
          # archive 报 "Push Notifications capabilities are present in the app's entitlements,
          # but not in the profile"。
          # 本工程没有任何 APNs/推送代码，给一份空 entitlements 即可消除这个不确定性。
          cat > Runner/CIAdHoc.entitlements << 'EOLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          EOLEOF
          # 后台 CPU 监控：每 60 秒打印一次占用最高的进程，
          # 用于判断卡住时是真在编译（clang/swift 高 CPU）还是死锁（全员 0%）
          # 附带磁盘余量检查：macOS runner 磁盘打满会让链接阶段假死
          ( while true; do
              echo "===== $(date '+%H:%M:%S') CPU 快照 ====="
              ps aux | sort -nrk 3 | head -8
              echo "--- 链接/编译进程状态（STAT 含 U/R 为可疑，%CPU=0 且长期不变=挂起）---"
              ps -axo pid,stat,%cpu,time,comm | grep -E "ld$|clang|dsymutil|swift" | grep -v grep | head -10 || true
              echo "--- xcodebuild 进程树（它和它的直接子进程，判断在等谁）---"
              XPID=$(pgrep -x xcodebuild | head -1) || true
              if [ -n "$XPID" ]; then
                ps -axo pid,ppid,stat,%cpu,time,comm | awk -v p="$XPID" '$1==p || $2==p' || true
              fi
              echo "--- Flutter/Dart/脚本进程 ---"
              pgrep -fl "flutter|dart|xcode_backend" | head -5 || true
              df -h /System/Volumes/Data | tail -1
              sleep 60
            done ) & MON_PID=$!
          mkdir -p build
          set +e
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Runner.xcarchive \
            "CODE_SIGN_STYLE=Manual" \
            "CODE_SIGN_IDENTITY=${SIGNING_IDENTITY}" \
            "DEVELOPMENT_TEAM=${IOS_TEAM_ID}" \
            "PROVISIONING_PROFILE_SPECIFIER=${PP_UUID}" \
            "CODE_SIGN_ENTITLEMENTS=Runner/CIAdHoc.entitlements" \
            "CLANG_ENABLE_EXPLICIT_MODULES=NO" \
            "SWIFT_ENABLE_EXPLICIT_MODULES=NO"
          ARCHIVE_EXIT=$?
          kill $MON_PID 2>/dev/null || true
          set -e
          if [ $ARCHIVE_EXIT -ne 0 ]; then
            echo "❌ xcodebuild archive 失败，退出码 $ARCHIVE_EXIT"
            exit $ARCHIVE_EXIT
          fi

      - name: 生成 ExportOptions.plist
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          PP_UUID: ${{ env.PP_UUID }}
        run: |
          BUNDLE_ID="${IOS_BUNDLE_ID:-com.gleamslime.works}"
          # provisioningProfiles 的值用 profile UUID；bitcode 相关键在 Xcode 14+ 已废弃，不再写
          cat > ios/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>release-testing</string>
              <key>teamID</key>
              <string>${IOS_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PP_UUID}</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Xcode exportArchive（生成 IPA）
        env:
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          # exportArchive 会重新签名，keychain 锁住时报 errSecInteractionNotAllowed
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" build.keychain
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath ios/build/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist
          ls -la build/ios/ipa

      - name: 上传到蒲公英
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          PGYER_USER_KEY: ${{ secrets.PGYER_USER_KEY }}
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ 未找到 IPA 文件"
            exit 1
          fi
          if [ -z "$PGYER_USER_KEY" ]; then
            echo "❌ 未配置 PGYER_USER_KEY secret（蒲公英控制台 https://www.pgyer.com/account/api 的 User Key）"
            exit 1
          fi
          echo "📦 上传到蒲公英: $IPA_PATH"
          # 版本更新描述与 GitHub Release 的提交清单同源（纯文本版）
          export GITHUB_EVENT_BEFORE='${{ github.event.before || '' }}' 
          bash scripts/ci_release_body.sh pgyer_desc.txt "${{ needs.detect-version.outputs.version }}" "${{ needs.detect-version.outputs.build_number }}" plain
          # 走 apiv1（与本地 scripts/publish_ios.py 一致）：
          # apiv2/app/upload 在本账号返回 code=1 Missing parameters "password"，
          # apiv1/app/upload 用 uKey + _api_key 可以正常上传。
          RESPONSE=$(curl -s -F "file=@${IPA_PATH}" \
            -F "uKey=${PGYER_USER_KEY}" \
            -F "_api_key=${PGYER_API_KEY}" \
            -F "updateDescription=<pgyer_desc.txt" \
            https://upload.pgyer.com/apiv1/app/upload)
          echo "📋 蒲公英响应: $RESPONSE"
          CODE=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('code', -1))" 2>/dev/null || echo "-1")
          if [ "$CODE" = "0" ]; then
            SHORT=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('data',{}).get('appShortcutUrl',''))" 2>/dev/null || echo "")
            echo "✅ 蒲公英上传成功: https://www.pgyer.com/${SHORT}"
          else
            MSG=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('message','未知错误'))" 2>/dev/null || echo "响应不是合法 JSON")
            echo "❌ 蒲公英上传失败: $MSG"
            exit 1
          fi

      - name: 清理 Keychain
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -f certificate.p12

      - name: 上传 iOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7

  build-android:
    needs: [detect-version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Flutter 依赖 + 代码生成
        shell: bash
        run: |
          # enforce-lockfile：严格按 lock 的版本与 hash 取包，不符直接失败
          flutter pub get --enforce-lockfile
          # 描边图标是构建期产物，*.g.dart 不入库，缺了它编译直接断
          # build_runner 在构建脚本刚生成/变化时会以 75 要求重跑：仅 75 重试一次
          for attempt in 1 2; do
            if flutter pub run build_runner build --delete-conflicting-outputs; then
              break
            else
              status=$?
              if [ "$status" -ne 75 ] || [ "$attempt" -eq 2 ]; then
                exit "$status"
              fi
            fi
          done
          dart run tool/stroke_icons/generate.dart

      - name: 写入 CI 构建信息
        shell: bash
        run: |
          # 构建号直接取 detect-version 的输出：各 job 自己算日期/哈希会在跨零点时
          # 与 Release tag 对不上；buildCode 是更新比较用的纯数字（GitHub run_number）。
          # 直接整份重写 build_info.dart（BSD/GNU sed 的 -i 语法不通用）。
          BUILD_NUMBER="${{ needs.detect-version.outputs.build_number }}"
          BUILD_CODE="${{ github.run_number }}"
          BUILD_TIME=$(TZ=Asia/Shanghai date +"%Y-%m-%d %H:%M UTC+8")
          cat > lib/core/build_info.dart <<EOF
          /// CI 打包信息：由 release.yml"写入 CI 构建信息"步骤在打包前生成。
          /// 本地开发构建仓库里这份保持空串，关于页回退显示 pubspec 构建号。
          class CiBuildInfo {
          CiBuildInfo._();
          /// CI 构建号，格式 YYYYMMDD.commit短hash（与 GitHub Release tag 一致）
          static const String buildNumber = '${BUILD_NUMBER}';
          /// CI 数字构建号（GitHub run_number），与 appcast 的 sparkle:version 一致
          static const String buildCode = '${BUILD_CODE}';
          /// CI 打包时间（北京时间 UTC+8）
          static const String buildTime = '${BUILD_TIME}';
          }
          EOF
          grep "static const" lib/core/build_info.dart

      - name: 创建 .env 文件
        run: |
          cat > .env << 'ENVEOF'
          PICACG_API_KEY=${{ secrets.PICACG_API_KEY }}
          PICACG_SIGN_KEY=${{ secrets.PICACG_SIGN_KEY }}
          ENVEOF

      - name: 打包 Android APK
        env:
          PICACG_API_KEY: ${{ secrets.PICACG_API_KEY }}
          PICACG_SIGN_KEY: ${{ secrets.PICACG_SIGN_KEY }}
        run: flutter build apk --release

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  publish-pgyer:
    needs: [detect-version, test, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 生成更新说明要回溯提交范围（与 GitHub Release 正文同源）
          fetch-depth: 0

      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk/

      - name: 上传到蒲公英
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
        run: |
          APK_PATH=$(find apk/ -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ 未找到 APK 文件"
            exit 1
          fi
          echo "📦 上传到蒲公英: $APK_PATH"
          # 版本更新描述与 GitHub Release 的提交清单同源（纯文本版）
          export GITHUB_EVENT_BEFORE='${{ github.event.before || '' }}' 
          bash scripts/ci_release_body.sh pgyer_desc.txt "${{ needs.detect-version.outputs.version }}" "${{ needs.detect-version.outputs.build_number }}" plain
          RESPONSE=$(curl -s -F "file=@${APK_PATH}" \
            -F "_api_key=${PGYER_API_KEY}" \
            -F "buildInstallType=2" \
            -F "buildUpdateDescription=<pgyer_desc.txt" \
            https://www.pgyer.com/apiv2/app/upload)
          echo "📋 蒲公英响应: $RESPONSE"
          CODE=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('code', -1))" 2>/dev/null || echo "-1")
          if [ "$CODE" = "0" ]; then
            echo "✅ 蒲公英上传成功"
          else
            echo "⚠️ 蒲公英上传可能失败，请检查响应"
          fi

  release:
    needs: [detect-version, test, build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: 列出产物
        run: find dist/ -type f | head -20

      - name: 获取 DMG 文件信息
        id: dmg-info
        run: |
          DMG_PATH=$(find dist/ -name "*.dmg" -type f | head -1)
          FILE_SIZE=0
          if [ -n "$DMG_PATH" ]; then
            FILE_SIZE=$(stat -c%s "$DMG_PATH" 2>/dev/null || echo "0")
          fi
          echo "file_size=$FILE_SIZE" >> "$GITHUB_OUTPUT"

      - name: 生成 Release 正文（本次推送的提交清单）
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before || '' }}
        # 正文由共享脚本生成：蒲公英上传（build-ios / publish-pgyer）用同一
        # 脚本的 plain 输出做"版本更新描述"，两端发布说明保持完全一致。
        run: bash scripts/ci_release_body.sh release_body.md "${{ needs.detect-version.outputs.version }}" "${{ needs.detect-version.outputs.build_number }}"

      - name: 创建或更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.tag }}
          name: "SlimeWorks v${{ needs.detect-version.outputs.version }}"
          body_path: release_body.md
          files: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.apk
            dist/**/*.ipa
          draft: false
          prerelease: false

      - name: 更新 appcast.xml
        env:
          VERSION: ${{ needs.detect-version.outputs.version }}
          BUILD_NUMBER: ${{ needs.detect-version.outputs.build_number }}
          BUILD_CODE: ${{ github.run_number }}
          TAG: ${{ needs.detect-version.outputs.tag }}
        run: |
          REPO="GleamSlime/SlimeWorks"
          DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          DMG_PATH=$(find dist/ -name "*.dmg" -type f | head -1)
          EXE_PATH=$(find dist/ -name "*.exe" -type f | head -1)
          DMG_FILENAME=$(basename "$DMG_PATH")
          EXE_FILENAME=$(basename "$EXE_PATH")
          DMG_SIZE=$(stat -c%s "$DMG_PATH")
          EXE_SIZE=$(stat -c%s "$EXE_PATH")
          # macOS 的 EdDSA 签名由 build-macos 产出，必须原样写进 enclosure，
          # 否则 Sparkle 会报「此更新未正确签名，无法验证其真实性」
          ED_SIGNATURE=$(tr -d '\r\n' < dist/sparkle_ed_signature.txt 2>/dev/null || true)
          if [ -z "$ED_SIGNATURE" ]; then
            echo "::error::缺少 Sparkle 签名文件 dist/sparkle_ed_signature.txt"
            exit 1
          fi
          # macOS 的 sparkle:version 用纯数字构建号（与 CFBundleVersion 同源）；
          # Windows 的 WinSparkle 读 exe 的 4 段文件版本，所以补成 1.0.0.N
          WIN_VERSION="${VERSION}.${BUILD_CODE}"

          # 两个 item 分别用 sparkle:os 标记平台，避免 Windows 端抓到 macOS 的 DMG
          cat > docs/appcast.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>SlimeWorks</title>
              <language>zh-CN</language>
              <link>https://github.com/${REPO}</link>
              <item>
                <title>${VERSION}</title>
                <description>
                  <![CDATA[Auto build v${VERSION}+${BUILD_NUMBER}]]>
                </description>
                <pubDate>${DATE}</pubDate>
                <sparkle:version>${BUILD_CODE}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <enclosure
                  url="https://github.com/${REPO}/releases/download/${TAG}/${DMG_FILENAME}"
                  sparkle:os="macos"
                  sparkle:edSignature="${ED_SIGNATURE}"
                  length="${DMG_SIZE}"
                  type="application/octet-stream" />
              </item>
              <item>
                <title>${VERSION}</title>
                <pubDate>${DATE}</pubDate>
                <enclosure
                  url="https://github.com/${REPO}/releases/download/${TAG}/${EXE_FILENAME}"
                  sparkle:os="windows"
                  sparkle:version="${WIN_VERSION}"
                  sparkle:shortVersionString="${VERSION}"
                  length="${EXE_SIZE}"
                  type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF

      - name: 提交 appcast.xml 到 main 分支
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: 更新 appcast.xml for ${{ needs.detect-version.outputs.tag }}"
          file_pattern: docs/appcast.xml
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
